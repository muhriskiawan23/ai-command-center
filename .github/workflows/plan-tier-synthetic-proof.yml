name: BOR AI plan tier synthetic proof (NO SECRETS)

on:
  push:
    branches:
      - feat/plan-tier-server-gates-20261117
  pull_request:
    branches:
      - main
      - feat/stage3-real-d1-adapters-20261117
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bor-ai-plan-tier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plans-and-unit:
    name: Plan entitlement and full test suite (LOCAL ONLY)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run isolated plan and payment-state tests
        run: node --test tests/plan-entitlements.test.js
      - name: Run complete regression suite
        run: npm test
      - name: Syntax and build without deployment
        run: |
          npm run check
          node --check src/plan-entitlements.js
          node --check public/app.js
          npm run preview
      - name: Install existing locked CLI for local PNG runtime proof (NO SECRETS)
        run: npm ci --ignore-scripts --prefix tests/billing/stage3-wrangler-lock
      - name: Verify integrated D1 payment-backed Basic/Pro checks with synthetic Worker routes (NO SECRETS)
        run: node tests/billing/stage3-staging-smoke.mjs
      - name: Recreate local workerd and verify persisted D1 holds + emergency OFF (NO SECRETS)
        run: node tests/billing/stage3-workerd-restart-smoke.mjs
      - name: Two separate local workerd scripts share persistent D1, reject double-billing and honor global OFF (NO ACCOUNT)
        run: node tests/billing/stage3-two-worker-shared-d1-smoke.mjs
      - name: Decode and re-encode PNG pixels in actual local workerd (NO ACCOUNT)
        run: node tests/media/codec-workerd-proof.mjs

  browser-e2e:
    name: Browser E2E against stub AI and ephemeral SQLite (LOCAL ONLY)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e
