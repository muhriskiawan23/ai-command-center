name: Apply audit fixes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Terapkan ZIP, tes, lalu push ke branch baru
        run: |
          set -euo pipefail
          test -f bor-ai-audit-fixes.zip
          git checkout -b bor-ai/audit-fixes-auto
          unzip -o bor-ai-audit-fixes.zip -x '.github/*'
          git rm -q bor-ai-audit-fixes.zip
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security+refactor: terapkan perbaikan audit 11 Nov"
          git push origin bor-ai/audit-fixes-auto
