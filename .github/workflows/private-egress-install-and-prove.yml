name: BOR AI install private egress secret and prove runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-egress-install-and-prove.yml
      - tools/egress-proxy/runtime/install-and-prove.mjs
      - tools/egress-proxy/runtime/safe-diagnostics.mjs
permissions:
  contents: read
concurrency:
  group: bor-ai-production-deploy
  cancel-in-progress: false
jobs:
  install-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Validate secret availability without disclosure
        env:
          EGRESS_PROXY_TOKEN: ${{ secrets.EGRESS_PROXY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const t=process.env.EGRESS_PROXY_TOKEN;
          if (!t || t.length < 32 || /\s/.test(t)) throw Error("EGRESS_PROXY_TOKEN repository/production secret missing or invalid; upload the existing Termux token through gh secret set stdin");
          if (!process.env.CLOUDFLARE_API_TOKEN || !process.env.CLOUDFLARE_ACCOUNT_ID) throw Error("Cloudflare credentials missing");
          NODE
      - name: Run regression and syntax checks
        run: |
          npm test
          npm run check
      - name: Deploy OFF guard, install secret, verify metadata and private runtime
        env:
          EGRESS_PROXY_TOKEN: ${{ secrets.EGRESS_PROXY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/egress-proxy/runtime/install-and-prove.mjs
