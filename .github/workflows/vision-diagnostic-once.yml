name: BOR AI vision diagnostic (synthetic)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/vision-diagnostic-once.yml

permissions:
  contents: read

concurrency:
  group: bor-ai-one-shot-vision-diagnostic
  cancel-in-progress: false

jobs:
  synthetic-vision:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Test provider and live chat using a synthetic image (no personal data)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/diagnose-production-vision.mjs
