name: BOR AI Render egress entrypoint checks
on:
  pull_request:
    paths:
      - 'tools/egress-proxy/render/**'
      - 'tools/egress-proxy/pinned-transport.js'
      - 'tests/egress-proxy-render.test.js'
      - '.github/workflows/render-egress-entrypoint.yml'
  push:
    branches: [main]
    paths:
      - 'tools/egress-proxy/render/**'
      - 'tools/egress-proxy/pinned-transport.js'
      - 'tests/egress-proxy-render.test.js'
      - '.github/workflows/render-egress-entrypoint.yml'
jobs:
  render-entrypoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: node --test tests/egress-proxy-render.test.js
