name: BOR AI private D1 backup R2 bucket readiness (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify future private chat backup bucket metadata only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Reject non-main audit and test GET-only logic
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Run this read-only production audit from main"; exit 1;
          }
          node --test tests/bor-ai-private-backup-r2-audit.test.js
      - name: Verify bucket exists with no public access and exact reviewed retention (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_R2_AUDIT_TOKEN }}
        run: node scripts/verify-private-backup-r2-preflight.mjs
      - name: Never treat a bucket audit as private backup or recovery proof
        run: |
          echo "This is R2 METADATA ONLY: no R2 objects read/listed and no D1 export, restore or chat mutations."
          echo "A successful audit does not mean a customer SQL backup exists or has been independently restored."
