name: BOR AI provision private VPC service
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bor-ai-private-vpc-service
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Create private HTTP service only if absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          # Wrangler output can include identifiers; only print sanitized status.
          # Wrangler vpc service list does not promise a JSON output flag.
          # Use its documented default output; refuse to create when a matching name
          # appears, pending manual reconciliation of its settings.
          npx --yes wrangler@latest vpc service list > /tmp/bor-vpc-list.txt 2>/tmp/bor-vpc-error.log || {
            echo "::error::Cannot list VPC services; check CLI compatibility and permissions"; exit 1;
          }
          if grep -Fq 'bor-ai-termux-egress' /tmp/bor-vpc-list.txt; then
            echo "::error::VPC service name already exists; refusing duplicate creation without configuration verification"
            exit 1
          fi
          if npx --yes wrangler@latest vpc service create bor-ai-termux-egress \
              --type http \
              --tunnel-id 59f9b74c-4bf7-4f9f-9703-4eb73f6985a9 \
              --ipv4 127.0.0.1 \
              --http-port 10000 > /tmp/bor-vpc-create.log 2>&1; then
            echo "Private VPC service creation succeeded (no public hostname)."
          else
            # Only classify local CLI stderr. Never print raw output or response bodies.
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          const raw=fs.readFileSync("/tmp/bor-vpc-create.log","utf8").toLowerCase();
          const category =
            /unknown argument|unknown option|unrecognized option|unknown command|not enough arguments|missing required|invalid option/.test(raw) ? "cli_arguments" :
            /permission|unauthorized|forbidden|not authorized|403|insufficient scope|access denied/.test(raw) ? "authorization" :
            /payment|billing|subscription|plan required/.test(raw) ? "account_entitlement" :
            /not found|404/.test(raw) ? "resource_not_found" :
            /already exists|duplicate|conflict|409/.test(raw) ? "already_exists" :
            /timeout|timed out|network|fetch failed/.test(raw) ? "network" : "unknown";
          console.log("vpc_create_failure_category="+category);
          NODE
            echo "::error::Private VPC service creation failed; see sanitized failure category."
            exit 1
          fi
