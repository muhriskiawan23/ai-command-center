name: BOR AI image-only D1 schema release (manual and gated)

# Separate from the main Worker deploy so the currently-active URL Reader
# is NEVER replaced by the repository's reviewed Reader-OFF baseline.
# NO production writes by default. Owner must separately approve APPLY.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "PLAN lists exact remote pending image SQL; APPLY requires independent owner/security approval"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      confirmation:
        description: "For APPLY only: type CONFIRM_IMAGE_SCHEMA_0012_0016_BOR_AI_CHAT"
        required: false
        type: string
        default: ""
      reviewed_plan_sha:
        description: "For APPLY only: paste the full reviewed 40-character main SHA from a successful PLAN run"
        required: false
        type: string
        default: ""
      recovery_attestation:
        description: "For APPLY only: type PRIVATE_D1_RECOVERY_EVIDENCE_REVIEWED after securing the recovery point outside CI"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bor-ai-production-deploy
  cancel-in-progress: false

jobs:
  image_d1_schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Refuse unreviewed refs or missing manual approval
        shell: bash
        env:
          RELEASE_PHASE: ${{ inputs.phase }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REVIEWED_PLAN_SHA: ${{ inputs.reviewed_plan_sha }}
          RECOVERY_ATTESTATION: ${{ inputs.recovery_attestation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release must be manually dispatched from main"
            exit 1
          fi
          if [[ "$RELEASE_PHASE" != "plan" && "$RELEASE_PHASE" != "apply" ]]; then
            echo "::error::Unknown schema release phase"
            exit 1
          fi
          if [[ "$RELEASE_PHASE" == "apply" && "$CONFIRMATION" != "CONFIRM_IMAGE_SCHEMA_0012_0016_BOR_AI_CHAT" ]]; then
            echo "::error::Explicit owner approval phrase required for a live schema write"
            exit 1
          fi
          if [[ "$RELEASE_PHASE" == "apply" && "$REVIEWED_PLAN_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Apply requires owner review of the exact current main commit from a successful PLAN run"
            exit 1
          fi
          if [[ "$RELEASE_PHASE" == "apply" &&
                "$RECOVERY_ATTESTATION" != "PRIVATE_D1_RECOVERY_EVIDENCE_REVIEWED" ]]; then
            echo "::error::Apply requires operator-attested private recovery evidence; a CI bookmark fingerprint is not a backup"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Reject payment/synthetic SQL and prove isolated schema
        run: |
          set -euo pipefail
          node scripts/check-production-migration-isolation.mjs migrations
          node --test tests/image-only-migration-list.test.js tests/image-only-d1-manual-release.test.js tests/d1-image-migration-rollback.test.js
          node scripts/prepare-image-only-migration-list.mjs

      - name: List exact remote migration set using both pinned configs (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing Cloudflare read-only audit credentials"; exit 1; }
          npx --yes wrangler@4 d1 migrations list bor-ai-chat --remote --config wrangler.jsonc | tee "$RUNNER_TEMP/production-d1-pending.txt"
          node scripts/verify-image-schema-pending.mjs "$RUNNER_TEMP/production-d1-pending.txt" --expect-pair
          npx --yes wrangler@4 d1 migrations list bor-ai-chat --remote --config wrangler.image-only-migrations.generated.jsonc | tee "$RUNNER_TEMP/image-d1-pending.txt"
          node scripts/verify-image-schema-pending.mjs "$RUNNER_TEMP/image-d1-pending.txt" --expect-pair

      - name: Verify pinned production D1 identity and Time Travel restore bookmark (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-d1-image-migration-rollback.mjs

      - name: Refuse stale main commits before live D1 changes
        if: ${{ inputs.phase == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$current_main" || "$current_main" != "$GITHUB_SHA" ]]; then
            echo "::error::main moved during review; re-run planning against the new head before any schema write"
            exit 1
          fi

      - name: Apply ONLY reviewed 0012 and 0016 image SQL (EXPLICIT MANUAL APPROVAL)
        id: approved_image_sql_apply
        # Never mask a failed write: capture its outcome so we can run a
        # READ-ONLY postfailure inventory, then fail the workflow explicitly.
        continue-on-error: true
        if: ${{ inputs.phase == 'apply' }}
        env:
          # A separate short-lived least-privilege D1 Edit token is used ONLY
          # in this owner-attested mutation step. Do not elevate the existing
          # Cloudflare token used by read-only audits and regular workflows.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing protected-production CLOUDFLARE_D1_MIGRATION_TOKEN (D1 Edit, account scoped)"
            exit 1
          fi
          npx --yes wrangler@4 d1 migrations apply bor-ai-chat --remote --config wrangler.image-only-migrations.generated.jsonc

      - name: Inspect remote image migration state after failed apply (READ ONLY)
        if: ${{ always() && inputs.phase == 'apply' && steps.approved_image_sql_apply.outcome == 'failure' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Check the exact full pair remains pending. If partial, this fails
          # closed rather than silently applying the missing half or restoring.
          npx --yes wrangler@4 d1 migrations list bor-ai-chat --remote \
            --config wrangler.image-only-migrations.generated.jsonc \
            > "$RUNNER_TEMP/image-d1-after-failed-apply.txt"
          node scripts/verify-image-schema-pending.mjs \
            "$RUNNER_TEMP/image-d1-after-failed-apply.txt" --expect-pair
          echo "::warning::Cloudflare D1 refused the write; both migrations remain pending. Verify GitHub Actions token D1 Edit permissions in the CORRECT account, never paste the token into chat. No auto-retry."

      - name: Fail a refused migration even if postfailure inventory is unchanged
        if: ${{ always() && inputs.phase == 'apply' && steps.approved_image_sql_apply.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::Image-only production D1 migration failed. No deployment or paid-image activation allowed."
          exit 1

      - name: Check no remaining image migrations after approved apply (READ ONLY)
        if: ${{ inputs.phase == 'apply' && steps.approved_image_sql_apply.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations list bor-ai-chat --remote --config wrangler.image-only-migrations.generated.jsonc | tee "$RUNNER_TEMP/image-d1-after.txt"
          node scripts/verify-image-schema-pending.mjs "$RUNNER_TEMP/image-d1-after.txt" --expect-none

      - name: Explain safety status
        if: ${{ inputs.phase == 'plan' }}
        run: |
          echo "PLAN complete: D1 remains unchanged. This is not permission to apply migrations, deploy Media Lab, enable paid images or spend OpenAI credits."
