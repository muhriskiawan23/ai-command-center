name: BOR AI production deploy

on:
  workflow_dispatch:
    inputs:
      run_tavily_smoke:
        description: "Run one bounded live Tavily web search and one news search after deployment (uses 2 Tavily credits and 2 AI calls)"
        required: true
        type: boolean
        default: false
      preserve_active_tavily_reader:
        description: "Explicitly preserve only verified current Tavily Reader (<=8 daily URLs, no new activation), if needed to retain user link reading"
        required: true
        type: boolean
        default: false
      allow_reader_shutdown:
        description: "Explicitly allow disabling an active URL Reader only after separate owner/security review"
        required: true
        type: boolean
        default: false
      apply_db_migrations:
        description: "Apply pending production D1 migrations (only after reviewing pending changes and confirming the current Time Travel bookmark)"
        required: true
        type: boolean
        default: false
      enable_billing_shadow:
        description: "Enable only the read-only account-status endpoint using the separate billing shadow D1; no credits or checkout"
        required: true
        type: boolean
        default: false
      billing_shadow_d1_id:
        description: "UUID of bor-ai-billing-shadow created in the production Cloudflare account; never use the sandbox account ID"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bor-ai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision, migrate, and deploy BOR AI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      BOR_IMAGES_ENABLED: ${{ vars.BOR_IMAGES_ENABLED || 'false' }}
      IMAGE_CREDITS_GENERATE: ${{ vars.IMAGE_CREDITS_GENERATE }}
      IMAGE_CREDITS_EDIT: ${{ vars.IMAGE_CREDITS_EDIT }}
      IMAGE_TARIFF_VERSION: ${{ vars.IMAGE_TARIFF_VERSION }}
      IMAGE_PROVIDER_TOTAL_ATTEMPT_LIMIT: ${{ vars.IMAGE_PROVIDER_TOTAL_ATTEMPT_LIMIT }}
      BOR_TEXT_LUNA_PRIMARY: ${{ vars.BOR_TEXT_LUNA_PRIMARY || 'false' }}
      BOR_TEXT_LUNA_DAILY_USD_LIMIT: ${{ vars.BOR_TEXT_LUNA_DAILY_USD_LIMIT }}
      BOR_BILLING_SHADOW_ENABLED: ${{ inputs.enable_billing_shadow && 'true' || 'false' }}
      BOR_BILLING_SHADOW_D1_ID: ${{ inputs.billing_shadow_d1_id }}
    steps:
      - name: Reject dispatches outside main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment must be dispatched from the main branch. Selected ref: $GITHUB_REF"
            exit 1
          fi

      - name: Check out the exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Validate required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$GOOGLE_CLIENT_ID" || { echo "::error::Missing GOOGLE_CLIENT_ID repository secret"; exit 1; }
          if [[ "$BOR_BILLING_SHADOW_ENABLED" == "true" ]] &&
            [[ ! "$BOR_BILLING_SHADOW_D1_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Provide the billing shadow D1 UUID from the production Cloudflare account."
            exit 1
          fi

      # Protect the owner's currently working public-link path from a silent
      # rollout regression. This checks the actual 100%-active Worker version
      # read-only; a checked-in config cannot attest live Cloudflare state.
      - name: Block unreviewed URL Reader changes before upload
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOW_READER_SHUTDOWN: ${{ inputs.allow_reader_shutdown && 'true' || 'false' }}
          PRESERVE_ACTIVE_READER: ${{ inputs.preserve_active_tavily_reader && 'true' || 'false' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { buildPreservedTavilyReaderConfig } from "./scripts/reader-preserve-guard.mjs";
          const config=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const desired=config.vars?.URL_READER_ENABLED;
          if (!["true","false"].includes(desired)) throw Error("Candidate URL Reader flag is missing/invalid");
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const base="https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/scripts/ai-command-center";
          async function get(path) {
            const response=await fetch(base+path,{headers:{Authorization:"Bearer "+token,Accept:"application/json"},redirect:"error",signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error("Cannot attest active Worker version: HTTP "+response.status);
            const json=await response.json();
            if(json.success!==true)throw Error("Cloudflare active-version attestation failed");
            return json.result;
          }
          const deployment=(await get("/deployments?per_page=1"))?.deployments?.[0];
          const active=deployment?.versions?.filter(v=>v.percentage>0);
          if(active?.length!==1||active[0]?.percentage!==100||!active[0]?.version_id)throw Error("Cannot attest 100% active Worker version");
          const version=await get("/versions/"+encodeURIComponent(active[0].version_id));
          const bindings=version?.resources?.bindings;
          if(!Array.isArray(bindings))throw Error("Active Worker bindings unavailable");
          const named=bindings.filter(b=>b.name==="URL_READER_ENABLED");
          if(named.length!==1||named[0].type!=="plain_text"||!["true","false"].includes(named[0].text))
            throw Error("Active URL Reader flag is unverifiable; refuse release");
          const current=named[0].text;
          console.log("URL Reader active state:",current,"candidate state:",desired);
          if(current==="false"&&desired==="true")throw Error("Do not activate external URL Reader without independent security approval");
          if (process.env.PRESERVE_ACTIVE_READER==="true") {
            if(current!=="true" || desired!=="false") throw Error("Preservation requires an already-active Reader and reviewed OFF baseline");
            if(process.env.ALLOW_READER_SHUTDOWN==="true")throw Error("Reader preservation and shutdown approvals are mutually exclusive");
            if(process.env.BOR_IMAGES_ENABLED!=="false" || process.env.BOR_BILLING_SHADOW_ENABLED==="true")
              throw Error("Reader-preserving release cannot activate paid images or billing shadow");
            const {config: preserved, urlBudget}=buildPreservedTavilyReaderConfig(config,bindings);
            const path="wrangler.reader-preserve.generated.jsonc";
            fs.writeFileSync(path,JSON.stringify(preserved,null,2)+"\n");
            fs.appendFileSync(process.env.GITHUB_ENV,"BOR_READER_DEPLOY_CONFIG="+path+"\n");
            console.log("Preserving existing Tavily Reader with at most",urlBudget,"URLs per day; no new provider or quota expansion");
          } else if(current==="true"&&desired==="false"&&process.env.ALLOW_READER_SHUTDOWN!=="true") {
            throw Error("Release would disable currently active URL Reader; choose reviewed preservation or explicit shutdown");
          }
          console.log("URL Reader release transition verified without logging credential values");
          NODE

      - name: Test and validate Worker
        run: |
          npm test
          npm run check
          npm run preview

      - name: Select reviewed image deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "$BOR_IMAGES_ENABLED" == "true" ]]; then
            test -z "${BOR_READER_DEPLOY_CONFIG:-}" || { echo "::error::Paid image activation cannot be combined with Reader preservation"; exit 1; }
            node scripts/prepare-image-config.mjs
            npx --yes wrangler@4 deploy --dry-run --config wrangler.images.generated.jsonc
            npx --yes wrangler@4 secret list --config wrangler.jsonc --format json | node --input-type=module -e '
              let s=""; for await (const c of process.stdin) s+=c;
              if (!JSON.parse(s).some(x => x.name === "OPENAI_API_KEY")) throw Error("Configure OPENAI_API_KEY as a Worker secret before image activation.");
            '
            node scripts/provision-image-resources.mjs
            echo "BOR_DEPLOY_CONFIG=wrangler.images.generated.jsonc" >> "$GITHUB_ENV"
          else
            if [[ -n "${BOR_READER_DEPLOY_CONFIG:-}" ]]; then
              npx --yes wrangler@4 deploy --dry-run --config "$BOR_READER_DEPLOY_CONFIG"
            fi
            echo "BOR_DEPLOY_CONFIG=${BOR_READER_DEPLOY_CONFIG:-wrangler.jsonc}" >> "$GITHUB_ENV"
          fi

      - name: Verify the pinned production D1 database (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_ID="$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const binding = config.d1_databases?.find(item => item.binding === "DB");
          if (!binding?.database_id) throw new Error("Production D1 database_id must be pinned in wrangler.jsonc.");
          if (binding.database_name !== "bor-ai-chat") throw new Error("Unexpected production D1 database name.");
          process.stdout.write(binding.database_id);
          NODE
          )"
          export DB_ID
          RESULT="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID")"
          printf '%s' "$RESULT" | node --input-type=module -e '
            let s=""; for await (const c of process.stdin) s+=c;
            const d=JSON.parse(s);
            const db=d.result;
            if(d.success!==true || db?.uuid!==process.env.DB_ID || db?.name!=="bor-ai-chat") {
              throw new Error("Pinned D1 database verification failed; refusing production changes.");
            }
            console.log("Verified existing production D1 database:", db.name, db.uuid);
          '

      - name: List pending production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations list bor-ai-chat --remote --config wrangler.jsonc

      # The checked-in 0013..0015 billing SQL is synthetic-only and was
      # never approved for the production chat D1. Stop the ENTIRE migration
      # dispatch while those files are in the production migration directory:
      # Wrangler would otherwise apply all pending migrations as one set.
      - name: Reject synthetic billing migrations in production D1 directory
        if: ${{ inputs.apply_db_migrations }}
        run: node scripts/check-production-migration-isolation.mjs migrations

      - name: Apply D1 migrations
        if: ${{ inputs.apply_db_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply bor-ai-chat --remote --config wrangler.jsonc

      - name: Explain skipped production migrations
        if: ${{ !inputs.apply_db_migrations }}
        run: echo "Production D1 migrations were not applied. Review the migration list and explicitly enable apply_db_migrations on a later dispatch if needed."

      - name: Prepare reviewed Luna recovery settings
        if: ${{ env.BOR_TEXT_LUNA_PRIMARY == 'true' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { parseUsdMicro } from "./src/credit-metering.js";
          const dailyLimit = process.env.BOR_TEXT_LUNA_DAILY_USD_LIMIT;
          const microUsd = parseUsdMicro(dailyLimit);
          if (microUsd <= 0n || microUsd > 100000n) {
            throw Error("Set a positive Luna recovery budget of at most USD 0.10 per UTC day");
          }
          const config = JSON.parse(fs.readFileSync(process.env.BOR_DEPLOY_CONFIG, "utf8"));
          if (config.name !== "ai-command-center") throw Error("Unexpected production Worker");
          Object.assign(config.vars, {
            BOR_TEXT_LUNA_PRIMARY: "true",
            BOR_TEXT_BACKUP_ENABLED: "true",
            BOR_TEXT_BACKUP_DAILY_USD_LIMIT: dailyLimit,
            BOR_TEXT_AI_DAILY_USD_LIMIT: dailyLimit
          });
          const path = "wrangler.luna-recovery.generated.jsonc";
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          fs.appendFileSync(process.env.GITHUB_ENV, "BOR_DEPLOY_CONFIG=" + path + "\n");
          NODE

      - name: Prepare isolated billing shadow config for production only
        if: ${{ env.BOR_BILLING_SHADOW_ENABLED == 'true' }}
        run: node scripts/prepare-billing-shadow-config.mjs

      - name: Verify isolated billing shadow database and secret
        if: ${{ env.BOR_BILLING_SHADOW_ENABLED == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_ID="$BOR_BILLING_SHADOW_D1_ID"
          RESULT="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID")"
          printf '%s' "$RESULT" | EXPECTED_DB_ID="$DB_ID" node --input-type=module -e '
            let s=""; for await (const c of process.stdin) s+=c;
            const d=JSON.parse(s), db=d.result;
            if(d.success!==true || db?.uuid!==process.env.EXPECTED_DB_ID || db?.name!=="bor-ai-billing-shadow") {
              throw new Error("Dedicated billing shadow D1 verification failed; refusing production release.");
            }
            console.log("Verified isolated billing shadow D1:", db.name, db.uuid);
          '
          SECRET_LIST="$(npx --yes wrangler@4 secret list --config "$BOR_DEPLOY_CONFIG" --format json)"
          printf '%s' "$SECRET_LIST" | node --input-type=module -e '
            let s=""; for await (const c of process.stdin) s+=c;
            const entries=JSON.parse(s);
            if (!Array.isArray(entries) || !entries.some(x => x.name === "BOR_BILLING_SHADOW_PEPPER")) {
              throw new Error("Add BOR_BILLING_SHADOW_PEPPER as a Worker secret before enabling the billing shadow.");
            }
            console.log("Verified billing shadow secret presence by name only.");
          '
          # Initialize only the D1 whose account, UUID, name, and Worker secret were checked above.
          # Statements are idempotent, so a safe retry after a failed rollout is supported.
          npx --yes wrangler@4.165.0 d1 execute bor-ai-billing-shadow --remote \
            --config "$BOR_DEPLOY_CONFIG" \
            --file staging/billing-shadow/0001_readonly_schema.sql

          npx --yes wrangler@4.165.0 d1 execute bor-ai-billing-shadow --remote \
            --config "$BOR_DEPLOY_CONFIG" \
            --command "SELECT service,database_name,schema_version,EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='billing_shadow_accounts') AS accounts_table FROM billing_shadow_attestation WHERE id=1" \
            --json | node --input-type=module -e '
              let s=""; for await (const c of process.stdin) s+=c;
              const d=JSON.parse(s);
              const rows=Array.isArray(d) ? d.flatMap(x => x.results || []) : (d.results || []);
              const row=rows[0];
              if(row?.service!=="bor-billing-shadow-readonly" || row?.database_name!=="bor-ai-billing-shadow" ||
                row?.schema_version!==1 || !(row?.accounts_table===1 || row?.accounts_table===true)) {
                throw new Error("Billing shadow schema attestation failed; refusing production release.");
              }
              console.log("Verified read-only billing shadow schema attestation.");
            '

      # GOOGLE_CLIENT_ID is managed as a persistent Worker secret outside routine releases.
      # Do not run wrangler secret put here: it immediately deploys an intermediate Worker version.
      # The credential presence check above remains fail-closed; production secret rotation is a
      # separate, explicitly coordinated operation followed by a single reviewed release.
      - name: Verify image schema when image feature is enabled
        if: ${{ env.BOR_IMAGES_ENABLED == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute bor-ai-chat --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('image_reserve','image_reserve_debit','image_refund','image_grant')" --json | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const d=JSON.parse(s);if(d[0]?.results?.length!==4)throw Error("Apply reviewed image D1 migration 0012 before activation.")'

      - name: Verify candidate chat before switching production traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOR_PRODUCTION_LUNA_API_KEY: ${{ secrets.BOR_PRODUCTION_LUNA_API_KEY }}
        run: |
          set -euo pipefail
          wrangler() { npx --yes wrangler@4.165.0 "$@"; }
          smoke_chat() {
            curl --fail --silent --show-error --max-time 60 \
              -H 'Content-Type: application/json' \
              --data '{"message":"hi bor","agent":"coordinator","language":"id"}' \
              "$1/api/chat" | node --input-type=module -e '
                let body = "";
                for await (const chunk of process.stdin) body += chunk;
                const result = JSON.parse(body);
                const coordinatorModels = Array.isArray(result.agentModels)
                  ? result.agentModels.filter(model => model.agentId === "coordinator" && model.calls > 0)
                  : [];
                const generated = coordinatorModels.some(model => model.outcome === "success");
                const lunaRequired = process.env.BOR_TEXT_LUNA_PRIMARY === "true";
                const lunaSucceeded = coordinatorModels.some(model =>
                  model.modelId === "gpt-6-luna" && model.outcome === "success");
                if (typeof result.response !== "string" || !result.response.trim() || !generated) {
                  const summary = {
                    httpResult: "success",
                    responsePresent: typeof result.response === "string" && Boolean(result.response.trim()),
                    model: typeof result.model === "string" ? result.model : null,
                    code: typeof result.code === "string" ? result.code : null,
                    stage: typeof result.stage === "string" ? result.stage : null,
                    coordinatorModels: coordinatorModels.map(({ provider, modelId, outcome, failureType }) =>
                      ({ provider, modelId, outcome, failureType }))
                  };
                  console.error("Chat smoke response summary:", JSON.stringify(summary));
                  throw Error("Chat smoke test did not receive a model-generated answer");
                }
                if (lunaRequired && !lunaSucceeded) {
                  console.warn("Luna primary did not succeed; candidate chat remained available through its configured model failover.");
                }
              '
          }

          smoke_billing_shadow_auth_guard() {
            local base_url="$1"
            local body_file="$release_dir/billing-shadow-smoke.json"
            local status
            status="$(curl --silent --show-error --max-time 30 -o "$body_file" -w '%{http_code}' "$base_url/api/billing/account")"
            if [[ "$status" != "401" ]]; then
              echo "::error::Read-only billing shadow route did not require a verified login (HTTP $status)."
              exit 1
            fi
            node --input-type=module - "$body_file" <<'NODE'
          import { readFileSync } from "node:fs";
          const body = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (body.error !== "authentication_required" || body.realCreditsGranted !== false ||
              body.realSubscriptionEnabled !== false || body.productionCheckoutEnabled !== false) {
            throw new Error("Billing shadow unauthenticated smoke response was not fail-closed.");
          }
          NODE
            echo "Verified billing shadow route rejects requests without a verified session."
          }

          umask 077
          release_dir="$(mktemp -d)"
          trap 'rm -rf "$release_dir"' EXIT
          upload_output="$release_dir/wrangler-output.jsonl"
          upload_args=()
          if [[ "$BOR_TEXT_LUNA_PRIMARY" == "true" ]]; then
            node --input-type=module - "$release_dir/worker-secrets.json" <<'NODE'
          import fs from "node:fs";
          const key = process.env.BOR_PRODUCTION_LUNA_API_KEY;
          if (!key) throw Error("Set BOR_PRODUCTION_LUNA_API_KEY in the production GitHub environment");
          fs.writeFileSync(process.argv[2], JSON.stringify({ BOR_TEXT_BACKUP_API_KEY: key }), { mode: 0o600 });
          NODE
            upload_args+=(--secrets-file "$release_dir/worker-secrets.json")
          fi
          WRANGLER_OUTPUT_FILE_PATH="$upload_output" wrangler versions upload \
            --config "$BOR_DEPLOY_CONFIG" --message "github-sha:$GITHUB_SHA" "${upload_args[@]}"
          candidate="$(node --input-type=module - "$upload_output" <<'NODE'
          import { readFileSync } from "node:fs";
          const entry = readFileSync(process.argv[2], "utf8").trim().split("\n")
            .filter(Boolean).map(line => JSON.parse(line)).find(row => row.type === "version-upload");
          const id = entry?.version_id;
          if (!/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(id ?? "")) {
            throw Error("Wrangler did not return a candidate version ID");
          }
          const expectedUrl = "https://" + id.slice(0, 8) + "-ai-command-center.muhriskiawan23.workers.dev";
          if (entry.preview_url?.replace(/\/$/, "") !== expectedUrl) {
            throw Error("Enable Version URLs for this Worker to test the candidate before promotion");
          }
          console.log(id, expectedUrl);
          NODE
          )"
          read -r version_id candidate_url <<< "$candidate"
          smoke_media() {
            local base_url="$1"
            curl --fail --silent --show-error --max-time 20 "$base_url/media-lab.html" |
              node --input-type=module -e '
                let html="";for await(const chunk of process.stdin)html+=chunk;
                if(!html.includes("id=\"photoCanvas\"") || !html.includes("id=\"extractFrames\"")) {
                  throw Error("Media Lab HTML is missing expected local photo/video controls");
                }
                console.log("Local Media Lab page is present");
              '
            for asset in /media-lab.js /media-lab.css /media-validation.js; do
              curl --fail --silent --show-error --max-time 20 --output /dev/null "$base_url$asset"
            done
            echo "Local Media Lab assets are present (no paid image call)"
          }
          smoke_reader_preservation() {
            local base_url="$1"
            if [[ -z "${BOR_READER_DEPLOY_CONFIG:-}" ]]; then return 0; fi
            curl --fail --silent --show-error --max-time 20 "$base_url/api/plugins/capabilities" |
              node --input-type=module -e '
                let body=""; for await(const chunk of process.stdin)body+=chunk;
                const data=JSON.parse(body);
                if(data?.tools?.webReading?.enabled!==true || data?.tools?.webReading?.available!==true ||
                   data?.tools?.webActions?.available!==false) {
                  throw Error("Candidate public capabilities do not preserve bounded Reader while Web Actions remain OFF");
                }
                console.log("Reader capability preserved (configuration only; no billable Extract call)");
              '
          }
          smoke_chat "$candidate_url"
          smoke_media "$candidate_url"
          smoke_reader_preservation "$candidate_url"
          if [[ "$BOR_BILLING_SHADOW_ENABLED" == "true" ]]; then
            smoke_billing_shadow_auth_guard "$candidate_url"
          fi
          wrangler versions deploy "$version_id@100" --yes --config "$BOR_DEPLOY_CONFIG" \
            --message "github-sha:$GITHUB_SHA"
          wrangler triggers deploy --config "$BOR_DEPLOY_CONFIG"
          smoke_chat "https://ai-command-center.muhriskiawan23.workers.dev"
          smoke_media "https://ai-command-center.muhriskiawan23.workers.dev"
          smoke_reader_preservation "https://ai-command-center.muhriskiawan23.workers.dev"
          if [[ "$BOR_BILLING_SHADOW_ENABLED" == "true" ]]; then
            smoke_billing_shadow_auth_guard "https://ai-command-center.muhriskiawan23.workers.dev"
          fi

      # Read-only audit: Wrangler returns secret names/types, never secret values.
      # Keep this non-blocking so an optional search provider cannot break core releases.
      - name: Audit Brave Search Worker secret presence (names only)
        id: brave_secret_audit
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SECRET_LIST="$(npx --yes wrangler@4 secret list --config wrangler.jsonc --format json)"
          PRESENT="$(printf '%s' "$SECRET_LIST" | node --input-type=module -e '
            let s=""; for await (const c of process.stdin) s+=c;
            const entries=JSON.parse(s);
            if (!Array.isArray(entries)) throw new Error("Unexpected Wrangler secret-list response.");
            process.stdout.write(String(entries.some((entry) => entry?.name === "BRAVE_SEARCH_API_KEY")));
          ')"
          echo "BRAVE_SEARCH_API_KEY Worker secret: $PRESENT"
          echo "configured=$PRESENT" >> "$GITHUB_OUTPUT"
          if [[ "$PRESENT" != "true" ]]; then
            echo "::warning::Live Brave Search remains disabled until the founder configures the Worker secret."
          fi

      # Read-only audit: inspect secret names only; never print secret values.
      - name: Audit Tavily Search Worker secret presence (names only)
        id: tavily_secret_audit
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SECRET_LIST="$(npx --yes wrangler@4 secret list --config wrangler.jsonc --format json)"
          PRESENT="$(printf '%s' "$SECRET_LIST" | node --input-type=module -e '
            let s=""; for await (const c of process.stdin) s+=c;
            const entries=JSON.parse(s);
            if (!Array.isArray(entries)) throw new Error("Unexpected Wrangler secret-list response.");
            process.stdout.write(String(entries.some((entry) => entry?.name === "TAVILY_API_KEY")));
          ')"
          echo "TAVILY_API_KEY Worker secret: $PRESENT"
          echo "configured=$PRESENT" >> "$GITHUB_OUTPUT"
          if [[ "$PRESENT" != "true" ]]; then
            echo "::warning::Live Tavily Search remains disabled until the Worker secret is configured."
          fi

      - name: Verify production endpoints
        run: |
          set -euo pipefail
          BASE_URL="https://ai-command-center.muhriskiawan23.workers.dev"
          curl --fail --silent --show-error "$BASE_URL/api/health?deep=1" | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const d=JSON.parse(s);if(d.ok!==true||d.checks?.database!==true||d.checks?.aiBinding!==true)throw Error("Health check failed")'
          curl --fail --silent --show-error "$BASE_URL/api/agents" | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const d=JSON.parse(s);if(!Array.isArray(d.agents)||d.agents.length<10)throw Error("Agents check failed")'
          CONFIG_READY=0
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error "$BASE_URL/api/config" | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const d=JSON.parse(s);console.log("Google sign-in status:", JSON.stringify({enabled:d.googleSignInEnabled===true,hasClientId:Boolean(d.googleClientId)}));if(d.googleSignInEnabled!==true||!d.googleClientId)process.exit(1)'; then
              CONFIG_READY=1
              break
            fi
            echo "Google sign-in configuration is not ready yet (attempt $attempt/10); retrying in 3 seconds."
            sleep 3
          done
          test "$CONFIG_READY" = "1" || { echo "::error::Google sign-in is still disabled after 30 seconds. Check the Worker D1 binding and GOOGLE_CLIENT_ID secret."; exit 1; }
          echo "Google sign-in configuration verified."

      - name: Verify image feature deployment state without paid inference
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'https://ai-command-center.muhriskiawan23.workers.dev/api/images/config' | node --input-type=module -e '
            let s=""; for await (const c of process.stdin) s+=c;
            const d=JSON.parse(s);
            if(d.enabled !== (process.env.BOR_IMAGES_ENABLED === "true")) throw Error("Image feature deployment state does not match reviewed configuration.");
            console.log("Image generation enabled:",d.enabled);
          '

      - name: Optional live Tavily web and news smoke tests
        if: ${{ inputs.run_tavily_smoke }}
        env:
          TAVILY_SECRET_CONFIGURED: ${{ steps.tavily_secret_audit.outputs.configured }}
        run: |
          set -euo pipefail
          test "$TAVILY_SECRET_CONFIGURED" = "true" || { echo "::error::TAVILY_API_KEY is not present in the Worker secret inventory; refusing live search smoke tests."; exit 1; }
          BASE_URL="https://ai-command-center.muhriskiawan23.workers.dev"
          run_search_smoke() {
            local expected_type="$1"
            local payload="$2"
            curl --fail --silent --show-error --max-time 90 \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$BASE_URL/api/chat" \
              | EXPECTED_SOURCE_TYPE="$expected_type" node --input-type=module -e '
                let s=""; for await (const c of process.stdin) s+=c;
                const d=JSON.parse(s);
                if (typeof d.response !== "string" || d.response.trim().length < 10) throw new Error("Live search chat response missing.");
                const links=Array.isArray(d.links) ? d.links : [];
                const matches=links.filter(x => x?.ok === true && x?.sourceType === process.env.EXPECTED_SOURCE_TYPE);
                if (!matches.length) {
                  const reasons=links.filter(x => x?.ok === false).map(x => x.reason).filter(Boolean).slice(0,2);
                  throw new Error("No usable live " + process.env.EXPECTED_SOURCE_TYPE + " search source returned. " + reasons.join("; "));
                }
                console.log("Live " + process.env.EXPECTED_SOURCE_TYPE + " search passed; usable sources:", matches.length);
              '
          }
          run_search_smoke "search" '{"message":"Cari informasi terbaru tentang perkembangan teknologi kecerdasan buatan di Indonesia.","agent":"coordinator","language":"id"}'
          run_search_smoke "news" '{"message":"Berita terbaru hari ini tentang ekonomi Indonesia.","agent":"coordinator","language":"id"}'
