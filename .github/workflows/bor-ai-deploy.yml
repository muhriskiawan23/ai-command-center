name: BOR AI production deploy

on:
  workflow_dispatch:
    inputs:
      run_chat_smoke:
        description: "Run one low-cost live AI chat check after deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bor-ai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision, migrate, and deploy BOR AI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$GOOGLE_CLIENT_ID" || { echo "::error::Missing GOOGLE_CLIENT_ID repository secret"; exit 1; }

      - name: Test and validate Worker
        run: |
          npm test
          npm run check
          npm run preview

      - name: Find or create production D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_ID="$(node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`;
          const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
          async function call(url, init) {
            const response = await fetch(url, init);
            const data = await response.json();
            if (!response.ok || data.success !== true) {
              throw new Error(`Cloudflare D1 API failed (${response.status}): ${JSON.stringify(data.errors || data)}`);
            }
            return data.result;
          }
          const listed = await call(`${base}?name=bor-ai-chat`, { headers });
          let db = Array.isArray(listed) ? listed.find(item => item.name === "bor-ai-chat") : null;
          if (!db) db = await call(base, { method: "POST", headers, body: JSON.stringify({ name: "bor-ai-chat" }) });
          if (!db?.uuid) throw new Error("Cloudflare did not return a D1 database UUID.");
          process.stdout.write(db.uuid);
          NODE
          )"
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          node --input-type=module - "$DB_ID" <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const binding = config.d1_databases?.find(item => item.binding === "DB");
          if (!binding) throw new Error("D1 binding DB is missing from wrangler.jsonc");
          binding.database_id = process.argv[2];
          fs.writeFileSync("wrangler.jsonc", JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply bor-ai-chat --remote --config wrangler.jsonc

      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Configure Google sign-in
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_CLIENT_ID" | npx --yes wrangler@4 secret put GOOGLE_CLIENT_ID --config wrangler.jsonc

      - name: Verify production endpoints
        run: |
          set -euo pipefail
          BASE_URL="https://ai-command-center.muhriskiawan23.workers.dev"
          curl --fail --silent --show-error "$BASE_URL/api/health" | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const d=JSON.parse(s);if(d.ok!==true)throw Error("Health check failed")'
          curl --fail --silent --show-error "$BASE_URL/api/agents" | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const d=JSON.parse(s);if(!Array.isArray(d.agents)||d.agents.length<10)throw Error("Agents check failed")'
          curl --fail --silent --show-error "$BASE_URL/api/config" | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const d=JSON.parse(s);if(d.googleSignInEnabled!==true||!d.googleClientId)throw Error("Google sign-in is not enabled")'

      - name: Optional live chat check
        if: ${{ inputs.run_chat_smoke }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 \
            -H 'Content-Type: application/json' \
            --data '{"message":"Jelaskan manajemen risiko secara singkat.","agent":"coordinator"}' \
            'https://ai-command-center.muhriskiawan23.workers.dev/api/chat' \
            | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const d=JSON.parse(s);if(typeof d.response!=="string"||d.response.trim().length<20)throw Error("Live chat check failed")'
