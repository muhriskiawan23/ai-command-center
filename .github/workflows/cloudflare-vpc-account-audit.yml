name: BOR AI Cloudflare VPC account audit

on:
  workflow_run:
    workflows: ["BOR AI production deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bor-ai-cloudflare-vpc-account-audit
  cancel-in-progress: false

jobs:
  read-only-account-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      AUDIT_CLOUD_ONRAMPS_IN_SCOPE: ${{ vars.AUDIT_CLOUD_ONRAMPS_IN_SCOPE || 'false' }}
      AUDIT_CREDENTIAL_SOURCE: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN && 'dedicated audit secret' || 'deployment secret fallback' }}
    steps:
      - name: Inspect Cloudflare Zero Trust resources (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const summary = [];
          const statuses = [];
          console.log("Credential source: " + process.env.AUDIT_CREDENTIAL_SOURCE);

          function record(label, status, detail) {
            const line = `- **${label}:** ${status} — ${detail}`;
            console.log(line);
            summary.push(line);
            statuses.push(status);
          }

          if (!account || !token) {
            record("Cloudflare account audit", "SKIPPED", "account ID or API token unavailable; no API request was made.");
          } else {
            const base = "https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(account);
            const headers = { Authorization: "Bearer " + token, Accept: "application/json" };

            // These endpoints have different documented response envelopes.
            function cursorCollection(payload) {
              // CNI's documented contract is { items, next }. Some API
              // gateways wrap it as { success, result: { items, next } }.
              // Accept only these explicit envelopes, never infer an empty list.
              const wrapped = payload?.result != null;
              const data = wrapped ? payload.result : payload;
              const errorsOk = payload?.errors == null ||
                (Array.isArray(payload.errors) && payload.errors.length === 0);
              return {
                items: data?.items,
                info: {},
                next: data?.next,
                valid: payload != null && typeof payload === "object" &&
                  payload.success !== false && errorsOk &&
                  (!wrapped || payload.success === true) &&
                  Array.isArray(data?.items) &&
                  (data?.next == null || (Number.isSafeInteger(data.next) && data.next >= 0))
              };
            }

            async function readCollection(label, path, summarize, extract = (payload) => ({
              items: payload?.result, info: payload?.result_info || {}, next: null,
              valid: payload?.success === true
            }), pagination = "single") {
              const items = [];
              const seen = new Set();
              let currentPath = path;
              for (let index = 0; index < 10; index++) {
                try {
                  const response = await fetch(base + currentPath, {
                    method: "GET", headers, signal: AbortSignal.timeout(20000)
                  });
                  if (!response.ok) {
                    // Error messages may contain account/network details. Only numeric codes are safe to emit.
                    let codes = [];
                    try {
                      const error = await response.json();
                      codes = Array.isArray(error?.errors) ? error.errors.map(e => e?.code).filter(Number.isFinite).slice(0, 5) : [];
                    } catch {}
                    const status = [401, 403].includes(response.status) ? "PERMISSION DENIED" : "HTTP ERROR";
                    const note = response.status === 404 && path === "/magic/cloud/onramps"
                      ? " Documented Closed Beta endpoint; account availability/entitlement is unverified, not an empty inventory." : "";
                    record(label, status, `HTTP ${response.status}; codes=${codes.join(",") || "unavailable"}; response body suppressed.${note}`);
                    return;
                  }
                  const payload = await response.json();
                  const collection = extract(payload);
                  if (!collection?.valid || !Array.isArray(collection.items)) {
                    record(label, "API ERROR", "response envelope not verified; response body suppressed.");
                    return;
                  }
                  const info = collection.info || {};
                  items.push(...collection.items);
                  const requestUrl = new URL(base + currentPath);
                  if (pagination === "page") {
                    const page = Number(requestUrl.searchParams.get("page"));
                    const size = Number(requestUrl.searchParams.get("per_page"));
                    if ((info.page != null && info.page !== page) ||
                        (info.per_page != null && (!Number.isInteger(info.per_page) || info.per_page < 1 || info.per_page > size)) ||
                        (info.total_pages != null && (!Number.isInteger(info.total_pages) || info.total_pages < 0)) ||
                        (info.total_count != null && (!Number.isInteger(info.total_count) || info.total_count < items.length))) {
                      record(label, "API ERROR", "inconsistent pagination metadata; inventory not complete.");
                      return;
                    }
                    // Without total_pages, keep walking until an explicit empty terminal page.
                    const terminal = Number.isInteger(info.total_pages) ? page >= info.total_pages : collection.items.length === 0;
                    if (terminal) {
                      if ((info.total_count != null && info.total_count !== items.length) ||
                          (collection.items.length === 0 && Number.isInteger(info.total_pages) && page < info.total_pages)) {
                        record(label, "PAGINATION INCOMPLETE", "reported totals disagree with collected inventory.");
                        return;
                      }
                      summarize(items, { ...info, pages_read: index + 1, completion: Number.isInteger(info.total_pages) ? "reported total_pages" : "empty terminal page" }, null);
                      return;
                    }
                    if (collection.items.length === 0) {
                      record(label, "PAGINATION INCOMPLETE", "empty page precedes reported final page.");
                      return;
                    }
                    requestUrl.searchParams.set("page", String(page + 1));
                    currentPath = requestUrl.pathname.slice(new URL(base).pathname.length) + requestUrl.search;
                  } else if (pagination === "cursor" && collection.next != null) {
                    if (!Number.isSafeInteger(collection.next) || collection.next < 0 || seen.has(collection.next)) {
                      record(label, "PAGINATION INCOMPLETE", "invalid or repeated continuation cursor.");
                      return;
                    }
                    seen.add(collection.next);
                    requestUrl.searchParams.set("cursor", String(collection.next));
                    currentPath = requestUrl.pathname.slice(new URL(base).pathname.length) + requestUrl.search;
                  } else {
                    if ((Number.isFinite(info.total_pages) && info.total_pages > 1) ||
                        (Number.isFinite(info.total_count) && info.total_count > items.length)) {
                      record(label, "PAGINATION INCOMPLETE", "additional results exist; first page is not a complete inventory.");
                      return;
                    }
                    summarize(items, info, null);
                    return;
                  }
                } catch (error) {
                  const name = error?.name === "TimeoutError" || error?.name === "AbortError" ? "TIMEOUT" : "REQUEST ERROR";
                  record(label, name, "request details suppressed.");
                  return;
                }
              }
              record(label, "PAGINATION INCOMPLETE", "ten-page audit budget exhausted; inventory not complete.");
            }

            await readCollection(
              "Tunnel inventory",
              "/tunnels?per_page=1000&is_deleted=false",
              (items, info) => {
                const counts = {};
                for (const item of items) {
                  const type = String(item?.tun_type || item?.type || "unknown");
                  counts[type] = (counts[type] || 0) + 1;
                }
                record(
                  "Tunnel inventory",
                  "AUTHORIZED",
                  `visible=${Number.isFinite(info.total_count) ? info.total_count : items.length}; returned=${items.length}; types=${Object.entries(counts).map(([key, value]) => key + ":" + value).join(",") || "none"}. This endpoint inventories tunnel resources; it does not by itself prove absence of every separate WAN on-ramp or interconnect resource.`
                );
              }
            );

            await readCollection(
              "Workers VPC Connectivity Directory Services",
              "/connectivity/directory/services?per_page=1000&page=1",
              (items, info) => {
                const types = {};
                for (const item of items) {
                  const type = String(item?.type || "unknown");
                  types[type] = (types[type] || 0) + 1;
                }
                const pages = info.pages_read;
                record(
                  "Workers VPC Connectivity Directory Services",
                  "AUTHORIZED",
                  `returned=${items.length}; completion=${info.completion}; reported_total=${Number.isFinite(info.total_count) ? info.total_count : "unknown"}; pages=${pages ?? "unknown"}; types=${Object.entries(types).map(([key, value]) => key + ":" + value).join(",") || "none"}; service names, hosts, and tunnel identifiers suppressed.`
                );
              },
              undefined, "page"
            );

            await readCollection(
              "Dedicated Mesh node inventory",
              "/warp_connector?per_page=1000&is_deleted=false",
              (items, info) => {
                const states = {};
                for (const item of items) {
                  const state = String(item?.status || "unknown");
                  states[state] = (states[state] || 0) + 1;
                }
                record(
                  "Dedicated Mesh node inventory",
                  "AUTHORIZED",
                  `visible=${Number.isFinite(info.total_count) ? info.total_count : items.length}; returned=${items.length}; statuses=${Object.entries(states).map(([key, value]) => key + ":" + value).join(",") || "none"}.`
                );
              }
            );

            // Cloud on-ramps is a separate Closed Beta product, not required by a
            // Workers + D1 deployment without WAN cloud-VPC connectivity.
            // Opt in explicitly when this account uses cloud on-ramps.
            const onrampsInScope = process.env.AUDIT_CLOUD_ONRAMPS_IN_SCOPE === "true";
            if (!onrampsInScope) {
              summary.push("- **Magic Cloud Networking on-ramps:** OUT OF SCOPE (UNVERIFIED) — excluded by explicit audit scope setting; no on-ramp API request made; no claim of zero resources or API authorization.");
              console.log(summary.at(-1));
            } else await readCollection(
              "Magic Cloud Networking on-ramps",
              "/magic/cloud/onramps",
              (items) => {
                const states = {};
                for (const item of items) {
                  const state = String(item?.status?.lifecycle_state || "unknown");
                  states[state] = (states[state] || 0) + 1;
                }
                record(
                  "Magic Cloud Networking on-ramps",
                  "AUTHORIZED",
                  `visible=${items.length}; lifecycle_states=${Object.entries(states).map(([key, value]) => key + ":" + value).join(",") || "none"}.`
                );
              }
            );

            await readCollection(
              "Cloud Network Interconnects (CNI)",
              "/cni/cnis?limit=100",
              (items, _info, next) => {
                record(
                  "Cloud Network Interconnects (CNI)",
                  next == null ? "AUTHORIZED" : "PAGINATION INCOMPLETE",
                  `returned=${items.length}; additional_page=${next == null ? "no" : "yes"}; resource identifiers and network details suppressed.`
                );
              },
              cursorCollection, "cursor"
            );

            await readCollection(
              "Network interconnect inventory",
              "/cni/interconnects?limit=100",
              (items, _info, next) => {
                record(
                  "Network interconnect inventory",
                  next == null ? "AUTHORIZED" : "PAGINATION INCOMPLETE",
                  `returned=${items.length}; additional_page=${next == null ? "no" : "yes"}; resource identifiers and facility details suppressed.`
                );
              },
              cursorCollection, "cursor"
            );

            await readCollection(
              "Virtual networks",
              "/teamnet/virtual_networks?is_deleted=false",
              (items) => {
                const defaults = items.filter((item) => item?.is_default_network === true).length;
                record("Virtual networks", "AUTHORIZED", `visible=${items.length}; default_networks=${defaults}.`);
              }
            );

            await readCollection(
              "Gateway policies",
              "/gateway/rules?per_page=100&page=1",
              (items, info) => {
                const enabled = items.filter((item) => item?.enabled === true).length;
                const filters = {};
                for (const item of items) {
                  for (const filter of Array.isArray(item?.filters) ? item.filters : []) {
                    filters[String(filter)] = (filters[String(filter)] || 0) + 1;
                  }
                }
                record(
                  "Gateway policies",
                  "AUTHORIZED",
                  `page_count=${items.length}; reported_total=${Number.isFinite(info.total_count) ? info.total_count : "unknown"}; enabled_on_page=${enabled}; filter_types_on_page=${Object.entries(filters).map(([key, value]) => key + ":" + value).join(",") || "none"}.`
                );
              }
            );
          }

          const complete = statuses.length > 0 && statuses.every((status) => status === "AUTHORIZED");
          const overall = complete ? (process.env.AUDIT_CLOUD_ONRAMPS_IN_SCOPE === "true" ? "COMPLETE" : "COMPLETE FOR CONFIGURED SCOPE (ON-RAMPS UNVERIFIED)") : "PARTIAL / ACTION REQUIRED";
          const heading = [
            "## Cloudflare account audit",
            "",
            `**Coverage: ${overall}**`,
            "",
            ...summary,
            "",
            "This audit is read-only. It does not modify Cloudflare resources, policies, bindings, or secrets.",
            "A successful workflow execution means the audit script ran; it does not imply every API scope was authorized."
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, heading.join("\n") + "\n");
          console.log(`Audit coverage: ${overall}. No Cloudflare resources, policies, bindings, or secrets were changed.`);
          if (!complete) process.exitCode = 1;
          NODE
