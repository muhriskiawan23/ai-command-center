name: BOR AI Cloudflare VPC account audit

on:
  workflow_run:
    workflows: ["BOR AI production deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bor-ai-cloudflare-vpc-account-audit
  cancel-in-progress: false

jobs:
  read-only-account-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect Cloudflare Zero Trust resources (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const summary = [];
          const statuses = [];

          function record(label, status, detail) {
            const line = `- **${label}:** ${status} — ${detail}`;
            console.log(line);
            summary.push(line);
            statuses.push(status);
          }

          if (!account || !token) {
            record("Cloudflare account audit", "SKIPPED", "account ID or API token unavailable; no API request was made.");
          } else {
            const base = "https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(account);
            const headers = { Authorization: "Bearer " + token, Accept: "application/json" };

            async function readCollection(label, path, summarize, extract = (payload) => ({ items: payload?.result, info: payload?.result_info || {}, next: null })) {
              try {
                const response = await fetch(base + path, {
                  method: "GET",
                  headers,
                  signal: AbortSignal.timeout(20000)
                });

                if (response.status === 401 || response.status === 403) {
                  record(label, "PERMISSION DENIED", `HTTP ${response.status}; this is not an empty result.`);
                  return;
                }
                if (!response.ok) {
                  record(label, "HTTP ERROR", `HTTP ${response.status}; response body suppressed.`);
                  return;
                }

                const payload = await response.json();
                const collection = extract(payload);
                if (payload?.success !== true || !Array.isArray(collection?.items)) {
                  const codes = Array.isArray(payload?.errors)
                    ? payload.errors.map((error) => error?.code).filter(Number.isFinite).slice(0, 5)
                    : [];
                  record(label, "API ERROR", `response shape not verified; codes=${codes.join(",") || "unavailable"}.`);
                  return;
                }

                summarize(collection.items, collection.info || {}, collection.next ?? null);
              } catch (error) {
                const name = error?.name === "TimeoutError" || error?.name === "AbortError" ? "TIMEOUT" : "REQUEST ERROR";
                record(label, name, "request details suppressed.");
              }
            }

            await readCollection(
              "Tunnel inventory",
              "/tunnels?per_page=1000&is_deleted=false",
              (items, info) => {
                const counts = {};
                for (const item of items) {
                  const type = String(item?.tun_type || item?.type || "unknown");
                  counts[type] = (counts[type] || 0) + 1;
                }
                record(
                  "Tunnel inventory",
                  "AUTHORIZED",
                  `visible=${Number.isFinite(info.total_count) ? info.total_count : items.length}; returned=${items.length}; types=${Object.entries(counts).map(([key, value]) => key + ":" + value).join(",") || "none"}. This endpoint inventories tunnel resources; it does not by itself prove absence of every separate WAN on-ramp or interconnect resource.`
                );
              }
            );

            await readCollection(
              "Workers VPC Connectivity Directory Services",
              "/connectivity/directory/services?per_page=100&page=1",
              (items, info) => {
                const types = {};
                for (const item of items) {
                  const type = String(item?.type || "unknown");
                  types[type] = (types[type] || 0) + 1;
                }
                const pages = Number.isFinite(info.total_pages) ? info.total_pages : null;
                const status = pages === 1 ? "AUTHORIZED" : pages > 1 ? "PAGINATION INCOMPLETE" : "PAGINATION UNKNOWN";
                record(
                  "Workers VPC Connectivity Directory Services",
                  status,
                  `returned=${items.length}; reported_total=${Number.isFinite(info.total_count) ? info.total_count : "unknown"}; pages=${pages ?? "unknown"}; types=${Object.entries(types).map(([key, value]) => key + ":" + value).join(",") || "none"}; service names, hosts, and tunnel identifiers suppressed.`
                );
              }
            );

            await readCollection(
              "Dedicated Mesh node inventory",
              "/warp_connector?per_page=1000&is_deleted=false",
              (items, info) => {
                const states = {};
                for (const item of items) {
                  const state = String(item?.status || "unknown");
                  states[state] = (states[state] || 0) + 1;
                }
                record(
                  "Dedicated Mesh node inventory",
                  "AUTHORIZED",
                  `visible=${Number.isFinite(info.total_count) ? info.total_count : items.length}; returned=${items.length}; statuses=${Object.entries(states).map(([key, value]) => key + ":" + value).join(",") || "none"}.`
                );
              }
            );

            await readCollection(
              "Magic Cloud Networking on-ramps",
              "/magic/cloud/onramps",
              (items) => {
                const states = {};
                for (const item of items) {
                  const state = String(item?.status?.lifecycle_state || "unknown");
                  states[state] = (states[state] || 0) + 1;
                }
                record(
                  "Magic Cloud Networking on-ramps",
                  "AUTHORIZED",
                  `visible=${items.length}; lifecycle_states=${Object.entries(states).map(([key, value]) => key + ":" + value).join(",") || "none"}.`
                );
              }
            );

            await readCollection(
              "Cloud Network Interconnects (CNI)",
              "/cni/cnis?limit=100",
              (items, _info, next) => {
                record(
                  "Cloud Network Interconnects (CNI)",
                  next == null ? "AUTHORIZED" : "PAGINATION INCOMPLETE",
                  `returned=${items.length}; additional_page=${next == null ? "no" : "yes"}; resource identifiers and network details suppressed.`
                );
              },
              (payload) => ({
                items: payload?.result?.items,
                info: {},
                next: payload?.result?.next
              })
            );

            await readCollection(
              "Network interconnect inventory",
              "/cni/interconnects?limit=100",
              (items, _info, next) => {
                record(
                  "Network interconnect inventory",
                  next == null ? "AUTHORIZED" : "PAGINATION INCOMPLETE",
                  `returned=${items.length}; additional_page=${next == null ? "no" : "yes"}; resource identifiers and facility details suppressed.`
                );
              },
              (payload) => ({
                items: payload?.result?.items,
                info: {},
                next: payload?.result?.next
              })
            );

            await readCollection(
              "Virtual networks",
              "/teamnet/virtual_networks?is_deleted=false",
              (items) => {
                const defaults = items.filter((item) => item?.is_default_network === true).length;
                record("Virtual networks", "AUTHORIZED", `visible=${items.length}; default_networks=${defaults}.`);
              }
            );

            await readCollection(
              "Gateway policies",
              "/gateway/rules?per_page=100&page=1",
              (items, info) => {
                const enabled = items.filter((item) => item?.enabled === true).length;
                const filters = {};
                for (const item of items) {
                  for (const filter of Array.isArray(item?.filters) ? item.filters : []) {
                    filters[String(filter)] = (filters[String(filter)] || 0) + 1;
                  }
                }
                record(
                  "Gateway policies",
                  "AUTHORIZED",
                  `page_count=${items.length}; reported_total=${Number.isFinite(info.total_count) ? info.total_count : "unknown"}; enabled_on_page=${enabled}; filter_types_on_page=${Object.entries(filters).map(([key, value]) => key + ":" + value).join(",") || "none"}.`
                );
              }
            );
          }

          const complete = statuses.length > 0 && statuses.every((status) => status === "AUTHORIZED");
          const overall = complete ? "COMPLETE" : "PARTIAL / ACTION REQUIRED";
          const heading = [
            "## Cloudflare account audit",
            "",
            `**Coverage: ${overall}**`,
            "",
            ...summary,
            "",
            "This audit is read-only. It does not modify Cloudflare resources, policies, bindings, or secrets.",
            "A successful workflow execution means the audit script ran; it does not imply every API scope was authorized."
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, heading.join("\n") + "\n");
          console.log(`Audit coverage: ${overall}. No Cloudflare resources, policies, bindings, or secrets were changed.`);
          NODE
