name: BOR AI private chat backup R2 provision (manual, owner gated)

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [plan, provision]
        required: true
        default: plan
      reviewed_main_sha:
        type: string
        required: false
        default: ''
      owner_confirmation:
        type: string
        required: false
        default: ''
      storage_cost_approval:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: bor-ai-production-deploy
  cancel-in-progress: false

jobs:
  provision:
    name: Plan or explicitly provision isolated private R2 backup bucket
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    steps:
      - name: Reject unapproved and non-main R2 mutation before credentials
        shell: bash
        env:
          PHASE: ${{ inputs.phase }}
          REVIEWED: ${{ inputs.reviewed_main_sha }}
          CONFIRMATION: ${{ inputs.owner_confirmation }}
          COST_APPROVAL: ${{ inputs.storage_cost_approval }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Only main allowed"; exit 1; }
          if [[ "$PHASE" == "plan" ]]; then
            [[ -z "$REVIEWED" && -z "$CONFIRMATION" && -z "$COST_APPROVAL" ]] || {
              echo "::error::PLAN must not include production resource approval"; exit 1;
            }
          elif [[ "$PHASE" == "provision" ]]; then
            [[ "$REVIEWED" == "$GITHUB_SHA" &&
              "$CONFIRMATION" == "CREATE_ONLY_BOR_AI_CHAT_PRIVATE_R2_BACKUP_BUCKET" &&
              "$COST_APPROVAL" == "I_APPROVE_PRIVATE_CHAT_BACKUP_30_DAY_STORAGE_COST" ]] || {
              echo "::error::Explicit owner SHA review, bucket consent and storage-cost approval required"; exit 1;
            }
          else
            echo "::error::Unknown provision phase"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Offline proof of private-bucket security requirements (no Cloudflare calls)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/bor-ai-private-backup-r2-audit.test.js tests/bor-ai-private-backup-r2-provision.test.js

      - name: Reject stale SHA before any Cloudflare resource writes
        if: ${{ inputs.phase == 'provision' }}
        shell: bash
        run: |
          set -euo pipefail
          now="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$now" == "$GITHUB_SHA" ]] || {
            echo "::error::main changed; rerun PLAN before provisioning"; exit 1;
          }

      - name: Confirm dedicated bucket is ABSENT (GET metadata only, never inspect objects)
        if: ${{ inputs.phase == 'provision' }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_BACKUP_PROVISION_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[0-9a-f]{32}$/i.test(account||'')||!token)
            throw Error('Dedicated R2 backup provisioning credential absent');
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+
            '/r2/buckets/bor-ai-chat-private-backups';
          const res=await fetch(url,{method:'GET',redirect:'error',
            headers:{Authorization:'Bearer '+token,Accept:'application/json'},
            signal:AbortSignal.timeout(25000)});
          if(res.status===404){
            console.log('Confirmed private R2 backup bucket absent. Provisioning is explicitly owner-gated.');
          }else if(res.status===200){
            throw Error('Bucket already exists: do NOT replace, modify or overwrite it automatically. Review independent private R2 audit.');
          }else{
            throw Error('Bucket absence cannot be verified with the dedicated token; HTTP '+res.status);
          }
          NODE

      - name: Create ONLY the separately approved empty private chat backup R2 bucket
        if: ${{ inputs.phase == 'provision' }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_BACKUP_PROVISION_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.165.0 r2 bucket create bor-ai-chat-private-backups

      - name: Explicitly disable r2.dev access and set 30-day scoped retention
        if: ${{ inputs.phase == 'provision' }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_BACKUP_PROVISION_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.165.0 r2 bucket dev-url disable bor-ai-chat-private-backups --force
          npx --yes wrangler@4.165.0 r2 bucket lifecycle add \
            bor-ai-chat-private-backups bor-chat-private-backup-retention \
            private/bor-ai-chat/ --expire-days 30 --force

      - name: Independently check bucket private/access/retention requirements (GET ONLY)
        if: ${{ inputs.phase == 'provision' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_R2_BACKUP_PROVISION_TOKEN }}
        run: node scripts/verify-private-backup-r2-preflight.mjs

      - name: Report that planning has not created resources
        if: ${{ inputs.phase == 'plan' }}
        run: |
          echo 'PLAN safe: no Cloudflare API calls, R2 objects, bucket create, D1 export, Worker deploy, restore or paid OpenAI calls.'
