name: BOR AI Duitku sandbox deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bor-ai-duitku-sandbox-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = 'refs/heads/main'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verify sandbox payment invariants
        run: node --test tests/duitku-sandbox.test.js
      - name: Provision dedicated sandbox DB
        run: node scripts/provision-duitku-sandbox.mjs
      - name: Build isolated Worker
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.duitku-sandbox.generated.jsonc
      - name: Apply sandbox schema
        run: npx --yes wrangler@4 d1 migrations apply bor-ai-duitku-sandbox --remote --config wrangler.duitku-sandbox.generated.jsonc
      - name: Deploy sandbox Worker
        run: npx --yes wrangler@4 deploy --config wrangler.duitku-sandbox.generated.jsonc --message "github-sha:$GITHUB_SHA"
      - name: Probe sandbox without transactions or secret values
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('wrangler.duitku-sandbox.generated.jsonc','utf8'));
          const base=config.vars.SANDBOX_PUBLIC_ORIGIN;
          const health=await fetch(base+'/health');
          const body=await health.json();
          if(!health.ok || body.sandbox!==true || body.realPaymentsEnabled!==false) throw Error('Sandbox health failed.');
          const callback=await fetch(base+'/api/duitku/callback');
          if(callback.status!==405) throw Error('Callback route missing.');
          console.log('Sandbox route deployed. Credentials configured:',body.configured);
          console.log('Callback URL:',base+'/api/duitku/callback');
          NODE
