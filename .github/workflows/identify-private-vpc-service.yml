name: BOR AI identify private VPC service binding
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/identify-private-vpc-service.yml]
permissions:
  contents: read
jobs:
  identify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Identify exact private service ID for Worker binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest vpc service list > /tmp/vpc-list.txt 2>/tmp/vpc-list-error.txt || {
            echo "::error::VPC inventory unavailable"; exit 1;
          }
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const raw=fs.readFileSync("/tmp/vpc-list.txt","utf8");
          const lines=raw.split(/\r?\n/).filter(s=>s.includes("bor-ai-termux-egress"));
          if(lines.length!==1) throw Error("Expected exactly one matching VPC service row");
          const ids=lines[0].match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi)||[];
          if(ids.length!==1) throw Error("Cannot reliably identify service ID from CLI table");
          console.log("BOR_AI_VPC_SERVICE_ID="+ids[0]);
          NODE
