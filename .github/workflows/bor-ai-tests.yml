name: BOR AI tests

on:
  push:
    branches:
      - main
      - bor-ai/stage-02-quality-hardening
      - bor-ai/stage-12-reliability-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bor-ai-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, syntax, and preview validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Check Worker syntax
        run: npm run check

      - name: Build Worker preview (no deployment)
        run: npm run preview
