name: BOR AI remote disposable D1 Stage 2 (manual, sandbox only)

# NEVER trigger from PRs, pushes or schedules. No production credentials.
# This workflow must only be run manually, after the owner has reviewed
# the remote-test code and set up a dedicated sandbox Cloudflare account.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-d1-sandbox:
    name: Stage 2 isolated remote D1 financial invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: billing-sandbox
    env:
      CI: 'true'
      CLOUDFLARE_SEND_METRICS: 'false'
      BOR_AI_D1_SANDBOX_TOKEN: ${{ secrets.BOR_AI_D1_SANDBOX_TOKEN }}
      BOR_AI_D1_SANDBOX_ACCOUNT_ID: ${{ vars.BOR_AI_D1_SANDBOX_ACCOUNT_ID }}
      BOR_AI_D1_SANDBOX_DB_NAME: ${{ vars.BOR_AI_D1_SANDBOX_DB_NAME }}
      BOR_AI_D1_SANDBOX_DB_ID: ${{ vars.BOR_AI_D1_SANDBOX_DB_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Assert isolated sandbox credentials and database identity; test D1
        run: node tests/billing/stage2-d1-proof.mjs --remote
      - name: Print evidence classification
        if: success()
        run: |
          echo "Remote disposable D1: verified SQL invariants and parallel callers."
          echo "No Workers AI provider invocation, no production DB, no payment transactions."
