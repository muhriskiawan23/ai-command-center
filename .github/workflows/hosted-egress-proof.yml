name: BOR AI hosted egress proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-peer-tls-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify hosted selected peer, observed peer and TLS identity
        env:
          EGRESS_PROXY_BASE_URL: ${{ secrets.RENDER_EGRESS_BASE_URL }}
          EGRESS_PROXY_TOKEN: ${{ secrets.RENDER_EGRESS_TOKEN }}
        run: node tools/egress-proxy/verify-hosted.mjs
