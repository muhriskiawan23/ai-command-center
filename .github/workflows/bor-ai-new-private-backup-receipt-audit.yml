name: BOR AI one new backup receipt (GET-only, manual)
# No SQL access, R2 object download, D1 export, backup trigger, restore, Worker deploy.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "plan=offline only; audit=read-only status + exact R2 metadata"
        type: choice
        options: [plan, audit]
        default: plan
        required: true
      reviewed_main_sha:
        description: "AUDIT only: exact 40-character reviewed main SHA; blank for PLAN"
        type: string
        default: ''
        required: false
      owner_confirmation:
        description: "AUDIT only: AUDIT_ONLY_NO_EXPORT; blank for PLAN"
        type: string
        default: ''
        required: false
      trigger_run_id:
        description: "AUDIT only: numeric GitHub run ID of the NEW owner-approved backup trigger"
        type: string
        default: ''
        required: false
permissions:
  contents: read
concurrency:
  group: bor-ai-readonly-new-backup-receipt
  cancel-in-progress: false

jobs:
  new_backup_receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Reject wrong main, SHA, audit inputs BEFORE Cloudflare credentials
        shell: bash
        env:
          PHASE: ${{ inputs.phase }}
          REVIEWED: ${{ inputs.reviewed_main_sha }}
          APPROVAL: ${{ inputs.owner_confirmation }}
          TRIGGER_RUN_ID: ${{ inputs.trigger_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo '::error::Only audited main branch'; exit 1;
          }
          if [[ "$PHASE" == 'plan' ]]; then
            [[ -z "$REVIEWED" && -z "$APPROVAL" && -z "$TRIGGER_RUN_ID" ]] || {
              echo '::error::PLAN must not have live audit inputs'; exit 1;
            }
          elif [[ "$PHASE" == 'audit' ]]; then
            [[ "$REVIEWED" == "$GITHUB_SHA" &&
               "$APPROVAL" == 'AUDIT_ONLY_NO_EXPORT' &&
               "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]{9,14}$ ]] || {
              echo '::error::AUDIT requires exact SHA/approval and owner-triggered run ID';
              exit 1;
            }
          else
            echo '::error::Unrecognized phase'; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Offline mock tests, no Cloudflare or customer SQL
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/audit-private-chat-backup-new-run-readonly.mjs
          node --test tests/private-chat-backup-new-run-receipt.test.js
      - name: Recheck exact main SHA has not changed before Cloudflare GET
        if: ${{ inputs.phase == 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$current" == "$GITHUB_SHA" ]] || {
            echo '::error::main moved; reapprove current main SHA'; exit 1;
          }
      - name: GET only exact new Cloudflare Workflow and private R2 object metadata (NO SQL)
        if: ${{ inputs.phase == 'audit' }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BACKUP_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_DEPLOY_TOKEN }}
          CLOUDFLARE_R2_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_R2_AUDIT_TOKEN }}
          BOR_BACKUP_RECEIPT_AUDIT_APPROVED: ${{ inputs.owner_confirmation }}
          BOR_BACKUP_TRIGGER_RUN_ID: ${{ inputs.trigger_run_id }}
        run: |
          set -euo pipefail
          node scripts/audit-private-chat-backup-new-run-readonly.mjs
      - name: PLAN passed; no Cloudflare requests or external writes
        if: ${{ inputs.phase == 'plan' }}
        run: echo 'Offline synthetic receipt tests passed; no Cloudflare operations.'
