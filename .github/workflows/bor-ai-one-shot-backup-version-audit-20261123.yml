name: BOR AI one-time post-deploy backup Worker version audit (GET ONLY)

# One-use bridge: dispatches the existing manual GET-only Cloudflare deployment
# metadata audit. No Cloudflare credentials, Worker deploy, R2 read, D1 SQL,
# backup export, Workflow instance trigger or paid external browser involved.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bor-ai-one-shot-backup-version-audit-20261123.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: bor-ai-one-shot-post-deploy-readonly-audit-20261123
  cancel-in-progress: false

jobs:
  verify_post_deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify this commit only retires dispatcher and requests read-only audit
        shell: bash
        env:
          REVIEWED_PARENT: b6e7618e787dd68e35adb25911a34abffcacbafc
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "muhriskiawan23/ai-command-center" &&
             "$GITHUB_REF" == "refs/heads/main" &&
             "$GITHUB_RUN_ATTEMPT" == "1" ]] || {
            echo "::error::Unexpected repository, branch or rerun"; exit 1;
          }
          [[ "$(git rev-parse HEAD^)" == "$REVIEWED_PARENT" ]] || {
            echo "::error::Unexpected parent; no audit dispatch"; exit 1;
          }
          [[ "$(git show -s --format=%s HEAD)" == "release(backup): one-shot GET-only deployed-version audit" ]] || {
            echo "::error::Unexpected commit purpose"; exit 1;
          }
          expected="$(printf '%s\n'             '.github/workflows/bor-ai-one-shot-backup-version-audit-20261123.yml'             '.github/workflows/bor-ai-one-shot-isolated-backup-deploy-20261123.yml'             'tests/bor-ai-one-shot-backup-version-audit-20261123.test.js'             'tests/bor-ai-one-shot-isolated-backup-deploy.test.js')"
          actual="$(git diff --name-only "$REVIEWED_PARENT" HEAD | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Unexpected files changed"; exit 1;
          }
          [[ ! -e '.github/workflows/bor-ai-one-shot-isolated-backup-deploy-20261123.yml' &&
             ! -e 'tests/bor-ai-one-shot-isolated-backup-deploy.test.js' ]] || {
            echo "::error::Old deploy bridge not retired"; exit 1;
          }
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$latest" == "$GITHUB_SHA" ]] || {
            echo "::error::Main moved after review"; exit 1;
          }
          echo 'Exact post-deploy audit request gate passed, no Cloudflare operations.'

      - name: Request official GET-only audit (new reviewed SHA)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST             "repos/$GITHUB_REPOSITORY/actions/workflows/bor-ai-isolated-backup-worker-version-audit.yml/dispatches"             -f 'ref=main'             -f "inputs[reviewed_main_sha]=$GITHUB_SHA"             -f 'inputs[owner_confirmation]=AUDIT_ISOLATED_BACKUP_DEPLOYMENT_ONLY'
          echo 'Read-only deployed Worker metadata audit requested; no backup export or deployment.'
