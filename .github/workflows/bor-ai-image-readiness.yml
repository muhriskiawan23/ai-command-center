name: BOR AI image launch readiness audit (read-only)

# Never mutate Cloudflare, D1, R2, Queues or provider account.
# Source-level tests run on PR; this production audit runs only when the
# reviewed workflow is merged to main or an operator dispatches it manually.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/image-readiness-audit.mjs'
      - '.github/workflows/bor-ai-image-readiness.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Cloudflare image prerequisites without changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verify local audit tests
        run: node --test tests/image-readiness-audit.test.js
      - name: Read-only active production readiness report (never deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/image-readiness-audit.mjs
      - name: List pending production D1 migrations only (NO APPLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Listing is read-only, but never use 'migrations apply' in this audit.
          # Image 0012 and 0016 are interleaved with billing 0013-0015.
          # The production deploy workflow's migration isolation gate must stay on.
          npx --yes wrangler@4 d1 migrations list bor-ai-chat --remote --config wrangler.jsonc
