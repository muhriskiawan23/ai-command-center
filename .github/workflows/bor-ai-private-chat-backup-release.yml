name: BOR AI isolated private chat D1 backup release (manual gated)

# PREPARE ONLY: no automatic deployment, scheduled export, SQL download,
# Worker cutover, migration, restore or paid-provider call.
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [plan, deploy, trigger]
        required: true
        default: plan
      reviewed_main_sha:
        type: string
        required: false
        default: ''
        description: "DEPLOY/TRIGGER: current 40-character main SHA reviewed after successful PLAN"
      owner_confirmation:
        type: string
        required: false
        default: ''
        description: "DEPLOY: DEPLOY_BOR_PRIVATE_CHAT_BACKUP ; TRIGGER: TRIGGER_BOR_PRIVATE_CHAT_BACKUP"
      signed_host:
        type: string
        required: false
        default: ''
        description: "DEPLOY only: independently verified EXACT Cloudflare R2 signed export URL hostname"
      low_traffic_confirmation:
        type: string
        required: false
        default: ''
        description: "TRIGGER only: I_ACCEPT_BRIEF_D1_EXPORT_UNAVAILABILITY"

permissions:
  contents: read

# An export may briefly block normal D1 queries. Do not overlap with
# production image migrations, normal production deploys or other exports.
concurrency:
  group: bor-ai-production-deploy
  cancel-in-progress: false

jobs:
  private_backup_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Reject unreviewed branch, phase and confirmation before any secrets or API calls
        shell: bash
        env:
          PHASE: ${{ inputs.phase }}
          SHA_APPROVED: ${{ inputs.reviewed_main_sha }}
          APPROVAL: ${{ inputs.owner_confirmation }}
          HOST: ${{ inputs.signed_host }}
          TRAFFIC_ACK: ${{ inputs.low_traffic_confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Use main only"; exit 1; }
          if [[ "$PHASE" == "plan" ]]; then
            [[ -z "$SHA_APPROVED" && -z "$APPROVAL" && -z "$HOST" && -z "$TRAFFIC_ACK" ]] || {
              echo "::error::PLAN must not receive mutation or export confirmations"; exit 1;
            }
          elif [[ "$PHASE" == "deploy" ]]; then
            [[ "$SHA_APPROVED" == "$GITHUB_SHA" && "$APPROVAL" == "DEPLOY_BOR_PRIVATE_CHAT_BACKUP" &&
               -z "$TRAFFIC_ACK" && "$HOST" =~ ^[a-z0-9.-]+\.r2\.cloudflarestorage\.com$ ]] || {
              echo "::error::DEPLOY requires exact reviewed main SHA, owner approval and vetted signed host"; exit 1;
            }
          elif [[ "$PHASE" == "trigger" ]]; then
            [[ "$SHA_APPROVED" == "$GITHUB_SHA" && "$APPROVAL" == "TRIGGER_BOR_PRIVATE_CHAT_BACKUP" &&
               "$TRAFFIC_ACK" == "I_ACCEPT_BRIEF_D1_EXPORT_UNAVAILABILITY" && -z "$HOST" ]] || {
              echo "::error::TRIGGER requires exact SHA, separately reviewed export/availability approval"; exit 1;
            }
          else
            echo "::error::Unknown backup release phase"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Prove isolated config remains OFF in all PLANs and dry-run it
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/bor-chat-private-backup-staging.test.js tests/bor-ai-private-backup-r2-audit.test.js
          node scripts/prepare-chat-private-backup-staging.mjs
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const cfg=JSON.parse(readFileSync('wrangler.chat-private-backup.generated.jsonc','utf8'));
          if(cfg.name!=='bor-ai-chat-backup-isolated'||cfg.vars.BOR_BACKUP_ENABLED!=='false'||
             cfg.vars.BOR_BACKUP_OWNER_APPROVED!=='false'||cfg.d1_databases||cfg.assets||
             cfg.routes||cfg.triggers||cfg.workflows?.length!==1||
             cfg.workflows[0].schedules)throw Error('Backup PLAN is not safe/off or isolated');
          console.log('Isolated backup PLAN verified safe-off; no D1 export.');
          NODE
          npx --yes wrangler@4.165.0 deploy --dry-run --experimental-auto-create=false \
            --config wrangler.chat-private-backup.generated.jsonc \
            --outdir .wrangler/private-chat-backup-release-plan

      - name: Confirm reviewed main is not stale before external operations
        if: ${{ inputs.phase != 'plan' }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$sha" == "$GITHUB_SHA" ]] || {
            echo "::error::main changed after review; re-run a read-only PLAN and approve new SHA"; exit 1;
          }

      - name: Verify existing dedicated R2 backup bucket is private (GET only)
        if: ${{ inputs.phase != 'plan' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_R2_AUDIT_TOKEN }}
        run: node scripts/verify-private-backup-r2-preflight.mjs

      - name: Fail before deploy if either dedicated backup credential is unavailable
        if: ${{ inputs.phase == 'deploy' }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BACKUP_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_DEPLOY_TOKEN }}
          BOR_PRIVATE_D1_EXPORT_TOKEN: ${{ secrets.BOR_PRIVATE_D1_EXPORT_TOKEN }}
        run: |
          set -euo pipefail
          # Fail BEFORE creating a Cloudflare Worker or Workflow. A later
          # secret-put failure must not leave an unnecessary half-deployed
          # release when an expected GitHub secret is missing.
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[0-9a-fA-F]{32}$ ]] || {
            echo "::error::Cloudflare account ID missing or malformed"; exit 1;
          }
          [[ -n "${CLOUDFLARE_BACKUP_DEPLOY_TOKEN:-}" && -n "${BOR_PRIVATE_D1_EXPORT_TOKEN:-}" ]] || {
            echo "::error::Dedicated Worker deploy AND D1 export credentials are required before deploy"; exit 1;
          }
          echo 'Dedicated backup credentials present (values never logged); no Cloudflare changes in this gate.'

      - name: Read-only verify dedicated Cloudflare credentials and exact pinned D1 metadata
        if: ${{ inputs.phase == 'deploy' }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BACKUP_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_DEPLOY_TOKEN }}
          BOR_PRIVATE_D1_EXPORT_TOKEN: ${{ secrets.BOR_PRIVATE_D1_EXPORT_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {PINNED_D1_ID} from './src/bor-chat-private-backup-core.js';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const deploy=process.env.CLOUDFLARE_BACKUP_DEPLOY_TOKEN;
          const exportToken=process.env.BOR_PRIVATE_D1_EXPORT_TOKEN;
          if(!/^[0-9a-f]{32}$/i.test(account||'')||!deploy||!exportToken)
            throw Error('private_backup_readonly_token_preflight_missing');
          // GET-only: do not invoke D1 export, D1 SQL, Worker deploy or R2 writes.
          // Never log token values, bearer headers, API JSON bodies or user data.
          const get=async(path,token)=>{
            let response;
            try{response=await fetch('https://api.cloudflare.com/client/v4/'+path,{
              method:'GET',redirect:'error',signal:AbortSignal.timeout(20000),
              headers:{Authorization:'Bearer '+token,Accept:'application/json'}
            });}catch{throw Error('private_backup_readonly_cloudflare_unreachable');}
            if(!response.ok)throw Error('private_backup_readonly_cloudflare_http_'+response.status);
            let json;
            try{json=await response.json();}catch{throw Error('private_backup_readonly_invalid_json');}
            if(json.success!==true||!json.result)
              throw Error('private_backup_readonly_cloudflare_response_invalid');
            return json.result;
          };
          for(const [name,token] of [['deploy',deploy],['export',exportToken]]){
            const verified=await get('user/tokens/verify',token);
            if(verified.status!=='active')
              throw Error('private_backup_'+name+'_token_not_active');
          }
          // Cloudflare GET /d1/database/<id> exposes metadata, NOT SQL/chat.
          const db=await get('accounts/'+account+'/d1/database/'+PINNED_D1_ID,exportToken);
          if(db.uuid!==PINNED_D1_ID||db.name!=='bor-ai-chat')
            throw Error('private_backup_export_token_database_pin_mismatch');
          // Verify ability to read Workers metadata on the pinned account.
          // Does not prove a Workflow can be deployed; Wrangler still fails
          // closed on any later insufficient permission.
          await get('accounts/'+account+'/workers/scripts?per_page=1',deploy);
          console.log('Dedicated Cloudflare tokens are active; pinned account resource metadata GET checks passed. No D1 export or Worker deploy.');
          NODE

      - name: Deploy ONLY the isolated backup Worker and Cloudflare Workflow (no export)
        if: ${{ inputs.phase == 'deploy' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_DEPLOY_TOKEN }}
          BOR_PRIVATE_BACKUP_RELEASE_APPROVED: DEPLOY_ISOLATED_BOR_CHAT_PRIVATE_BACKUP_WORKFLOW
          BOR_PRIVATE_BACKUP_BUCKET_REVIEWED: bor-ai-chat-private-backups
          BOR_PRIVATE_BACKUP_SIGNED_HOST: ${{ inputs.signed_host }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || {
            echo "::error::Missing dedicated private-backup Worker deploy credential"; exit 1;
          }
          node scripts/prepare-chat-private-backup-staging.mjs
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const cfg=JSON.parse(readFileSync('wrangler.chat-private-backup.generated.jsonc','utf8'));
          if(cfg.name!=='bor-ai-chat-backup-isolated'||cfg.vars.BOR_BACKUP_ENABLED!=='true'||
             cfg.vars.BOR_BACKUP_OWNER_APPROVED!=='true'||cfg.d1_databases||cfg.assets||
             cfg.routes||cfg.triggers||cfg.workers_dev!==false||
             cfg.workflows?.length!==1||cfg.workflows[0].schedules)
            throw Error('Private backup deploy escaped reviewed isolated scope');
          console.log('Deploying independently reviewed ISOLATED backup Worker; no D1 export.');
          NODE
          npx --yes wrangler@4.165.0 deploy --experimental-auto-create=false \
            --config wrangler.chat-private-backup.generated.jsonc

      - name: Set the restricted export token only on the isolated Worker
        if: ${{ inputs.phase == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOR_PRIVATE_D1_EXPORT_TOKEN: ${{ secrets.BOR_PRIVATE_D1_EXPORT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${BOR_PRIVATE_D1_EXPORT_TOKEN:-}" ]] || {
            echo "::error::Missing restricted Cloudflare deploy/export credential"; exit 1;
          }
          # Never print a token or create a file containing one. This only
          # changes the separate non-public backup Worker secret; no export.
          printf '%s' "$BOR_PRIVATE_D1_EXPORT_TOKEN" |
            npx --yes wrangler@4.165.0 secret put BOR_D1_EXPORT_TOKEN \
              --config wrangler.chat-private-backup.generated.jsonc
          echo 'Restricted export token installed in isolated Worker (no chat exported).'

      - name: Manually trigger exactly one owner-approved Cloudflare backup instance
        if: ${{ inputs.phase == 'trigger' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || {
            echo "::error::No dedicated Cloudflare backup trigger credential"; exit 1;
          }
          # One intentionally unique ID per Github run. Never set cron or
          # emit any R2 object content, signed export URL or workflow steps.
          instance="bor-ai-private-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx --yes wrangler@4.165.0 workflows trigger bor-ai-chat-private-backup-v1 \
            '{"purpose":"owner-approved-private-backup"}' \
            --id "$instance" > "$RUNNER_TEMP/bor-ai-backup-trigger.txt"
          echo "Cloudflare private backup instance accepted: $instance"
          echo 'Trigger is not backup completion or independently proven recovery.'

      - name: Report PLAN only, no real backups
        if: ${{ inputs.phase == 'plan' }}
        run: |
          echo 'Source-only PLAN passed. No production Worker deploy, D1 export, R2 write, restore, schema mutation or paid image call.'
