name: BOR AI encrypted Tunnel connector handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch connector token and encrypt to Android public key
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import { publicEncrypt, constants, createPublicKey } from "node:crypto";
          import { writeFileSync } from "node:fs";
          const publicKey = `-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA5tQScPR/EjlZo9XTkotY
          dsI5pOvVZVRajTlC/HOj82o7WMKc5NExSDOKHsMAQkEoqMjzlRtBqJ3kGuXlyAM1
          NrkhWxQ5ix+bGPdS7qJzcsnU9JMAUNjgCDrIK9OqESssonJvwqj36TtX7Nj653do
          L8cieuvzKnAO+29UvTBYHQKWU6ntgYT5nkBtvlztrsmLWHdKHvFFCmIRejlWw1/i
          zts0/uvh76TYLQXDccPngxVwq+htsk35Mz6TfUmeqvA8H5JNomjoMupXGSt0ePAI
          RcJtziBij711mLB8cnqCF6AQ7/UvBMWgyPD6KuDWHBWJE5qYT92fj1uJQId+R7BC
          D8CZ+TiO2ITHQw7e8CZnHBuTCjnm7rmosArHOUCsw21m7ijKu5ARYwu22Vho7sAA
          Iczm+1Uh1P//p3oq2KWIImaMtM9+p3Q85U1Yy/IKG3Xr1QljsPZIlHuav8Qov5sT
          ZfIkOLSe/2M/XbfFraxkFKDB+MYdLhcJ3/EIgp326ta3AgMBAAE=
          -----END PUBLIC KEY-----`;
          const tunnelId = "59f9b74c-4bf7-4f9f-9703-4eb73f6985a9";
          const account = process.env.CF_ACCOUNT;
          const token = process.env.CF_TOKEN;
          if (!account || !token) throw Error("Missing Cloudflare API credentials");
          const url = "https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(account) + "/cfd_tunnel/" + tunnelId + "/token";
          const response = await fetch(url, { headers: {Authorization: "Bearer " + token, Accept: "application/json"}, signal: AbortSignal.timeout(20000) });
          if (!response.ok) throw Error("Connector token retrieval failed: HTTP " + response.status);
          const body = await response.json();
          if (body.success !== true || typeof body.result !== "string" || body.result.length < 30) {
            throw Error("Unexpected connector token response; refusing to export");
          }
          const key = createPublicKey(publicKey);
          const raw = Buffer.from(body.result, "utf8");
          const max = key.asymmetricKeyDetails.modulusLength / 8 - 2 * 32 - 2;
          if (raw.length > max) throw Error("Connector token exceeds RSA-OAEP capacity; no artifact created");
          const encrypted = publicEncrypt({key, padding:constants.RSA_PKCS1_OAEP_PADDING, oaepHash:"sha256"}, raw);
          writeFileSync("tunnel-token.enc", encrypted, {mode:0o600});
          console.log("Encrypted connector credential prepared for the supplied Android public key; plaintext not logged.");
          NODE
      - name: Upload encrypted credential only
        uses: actions/upload-artifact@v4
        with:
          name: bor-ai-tunnel-token-encrypted
          path: tunnel-token.enc
          retention-days: 1
          if-no-files-found: error
