name: BOR AI read-only production readiness
on:
  workflow_dispatch:
    inputs:
      expected_reader_state:
        description: "Read-only audit: safe-off default, or explicitly verify existing bounded Tavily Reader (never activate it)"
        type: choice
        required: true
        default: 'off'
        options:
          - 'off'
          - preserved
  push:
    branches: [main]
    paths:
      # Read-only audit when a merged change can alter release/egress/media behavior.
      # This workflow NEVER deploys or exercises paid inference/extraction.
      - '.github/workflows/bor-ai-readonly-production-readiness.yml'
      - '.github/workflows/bor-ai-deploy.yml'
      - '.github/workflows/bor-ai-image-d1-release.yml'
      - 'wrangler.jsonc'
      - 'src/index.js'
      - 'src/links.js'
      - 'src/tavily-extract.js'
      - 'src/verified-egress.js'
      - 'src/plugin-capabilities.js'
      - 'src/image-jobs.js'
      - 'scripts/reader-preserve-guard.mjs'
      - 'scripts/readiness-reader-policy.mjs'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Read-only runtime, URL Reader and image gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    env:
      EXPECTED_READER_STATE: ${{ inputs.expected_reader_state || 'off' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Check production public health and agents without inference
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-command-center.muhriskiawan23.workers.dev"
          curl --fail --silent --show-error --retry 2 --max-time 20 "$BASE/api/health?deep=1" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const d=JSON.parse(s);if(d.ok!==true||d.checks?.database!==true||d.checks?.aiBinding!==true)process.exit(1);console.log("Production D1 and AI bindings healthy (no inference)")})'
          curl --fail --silent --show-error --retry 2 --max-time 20 "$BASE/api/agents" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const d=JSON.parse(s);if(!Array.isArray(d.agents)||d.agents.length<10)process.exit(1);console.log("Production agents endpoint healthy")})'
      - name: Check active Cloudflare Worker URL Reader binding values without printing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {verifyReaderBindings} from './scripts/readiness-reader-policy.mjs';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!account || !token) throw new Error("Cloudflare audit credentials unavailable");
          const base = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/ai-command-center";
          async function get(path) {
            const response = await fetch(base + path, { headers: { Authorization: "Bearer " + token, Accept: "application/json" }, signal: AbortSignal.timeout(25000) });
            if (!response.ok) throw new Error("Cloudflare audit API failed with HTTP " + response.status);
            const payload = await response.json();
            if (payload.success !== true) throw new Error("Cloudflare audit API returned failure");
            return payload.result;
          }
          const deployments = await get("/deployments?per_page=1");
          const deployment = deployments?.deployments?.[0];
          const active = deployment?.versions?.filter(v => v.percentage > 0);
          if (active?.length !== 1 || active[0].percentage !== 100 || !active[0].version_id) throw new Error("Expected one active Worker version with 100% traffic");
          const version = await get("/versions/" + encodeURIComponent(active[0].version_id));
          const bindings = version?.resources?.bindings;
          if (!Array.isArray(bindings)) throw new Error("Cannot verify active Worker bindings");
          const named = name => bindings.filter(b => b.name === name);
          const flag = named("URL_READER_ENABLED");
          const limit = named("TAVILY_EXTRACT_DAILY_URL_LIMIT");
          // Non-secret triage only: never print arbitrary binding text, account IDs or credentials.
          const readerState = flag.length === 1 && flag[0].type === "plain_text" &&
            (flag[0].text === "true" || flag[0].text === "false") ? flag[0].text : "unverifiable";
          const quotaState = limit.length === 0 ? "absent" :
            limit.length === 1 && limit[0].type === "plain_text" && /^(?:0+)$/.test(limit[0].text || "") ? "zero" :
            limit.length === 1 && limit[0].type === "plain_text" && /^[1-9][0-9]*$/.test(limit[0].text || "") ? "nonzero" : "unverifiable";
          console.log("Active URL Reader binding state:", readerState);
          console.log("Active Tavily Extract quota class:", quotaState);
          // Image generation is independently paid: no implicit activation of the pilot.
          // Missing BOR_IMAGES_ENABLED is safe-off for the Worker, but unknown/secret/true is not.
          const images = named("BOR_IMAGES_ENABLED");
          const imageState = images.length === 0 ? "absent" :
            images.length === 1 && images[0].type === "plain_text" && images[0].text === "false" ? "off" : "unverifiable-or-on";
          console.log("Active Image Assistant binding state:", imageState);
          // Compare the DEPLOYED release annotation before enforcing safe-off
          // flags. Otherwise a mismatch throws early and conceals whether the
          // running Worker was built from the commit under audit.
          const releaseMessage = deployment?.annotations?.["workers/message"];
          const expected = "github-sha:" + process.env.EXPECTED_MAIN_SHA;
          if (releaseMessage !== expected) {
            console.log("::warning::Production release differs from audited main commit (or release annotation is missing). Deployment is a separate approval step.");
            console.log("Production release synchronization: PENDING");
          } else {
            console.log("Production release synchronization: MATCHED");
          }
          // Diagnostic baseline only; explicit preserved mode is checked separately below.
          const activeReaderSafe = readerState === "false";
          const activeExtractSafe = !limit.length || quotaState === "zero";
          const activeImagesSafe = imageState === "absent" || imageState === "off";
          console.log("Read-only release safe-off checks:",
            JSON.stringify({reader:activeReaderSafe,extract:activeExtractSafe,images:activeImagesSafe}));
          if (!activeImagesSafe) throw new Error("Active Worker image generation is not verifiably OFF");
          verifyReaderBindings(bindings,process.env.EXPECTED_READER_STATE,process.env.GITHUB_EVENT_NAME);
          console.log("Active Worker Reader policy verified:",process.env.EXPECTED_READER_STATE);
          console.log("Active Worker paid Image Assistant: OFF");
          console.log("Binding names and secret values are not printed");
          NODE

      - name: Verify public Reader policy and Web Actions remain OFF
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-command-center.muhriskiawan23.workers.dev"
          curl --fail --silent --show-error --retry 2 --max-time 20 "$BASE/api/plugins/capabilities" |
            node --input-type=module -e '
              import {verifyPublicReader} from "./scripts/readiness-reader-policy.mjs";
              let body="";
              process.stdin.on("data", chunk => body += chunk).on("end", () => {
                const data = JSON.parse(body);
                const reading = data?.tools?.webReading;
                const actions = data?.tools?.webActions;
                // Public shape diagnostics deliberately expose ONLY fixed
                // booleans and count; never log the actual response payload.
                const toolsRecord = data?.tools !== null && typeof data?.tools === "object" &&
                  !Array.isArray(data?.tools);
                const feature = value => value === true ? "true" : value === false ? "false" : "unverifiable";
                console.log("Public capabilities schema:",
                  toolsRecord ? "tools-object" : "missing-or-invalid");
                console.log("Public capability fields:",
                  JSON.stringify({
                    webReading: reading === null || reading === undefined ? "absent" : "present",
                    webActions: actions === null || actions === undefined ? "absent" : "present",
                    readerEnabled: feature(reading?.enabled),
                    readerAvailable: feature(reading?.available),
                    actionsAvailable: feature(actions?.available)
                  }));
                verifyPublicReader(data,process.env.EXPECTED_READER_STATE,process.env.GITHUB_EVENT_NAME);
                console.log("Public Reader policy verified; Web Actions OFF");
              });'
