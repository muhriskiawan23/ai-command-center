name: BOR AI read-only production readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bor-ai-readonly-production-readiness.yml'
permissions:
  contents: read
jobs:
  verify:
    name: Read-only runtime and URL Reader gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check production public health and agents without inference
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-command-center.muhriskiawan23.workers.dev"
          curl --fail --silent --show-error --retry 2 --max-time 20 "$BASE/api/health?deep=1" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const d=JSON.parse(s);if(d.ok!==true||d.checks?.database!==true||d.checks?.aiBinding!==true)process.exit(1);console.log("Production D1 and AI bindings healthy (no inference)")})'
          curl --fail --silent --show-error --retry 2 --max-time 20 "$BASE/api/agents" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const d=JSON.parse(s);if(!Array.isArray(d.agents)||d.agents.length<10)process.exit(1);console.log("Production agents endpoint healthy")})'
      - name: Check active Cloudflare Worker URL Reader binding values without printing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!account || !token) throw new Error("Cloudflare audit credentials unavailable");
          const base = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/ai-command-center";
          async function get(path) {
            const response = await fetch(base + path, { headers: { Authorization: "Bearer " + token, Accept: "application/json" }, signal: AbortSignal.timeout(25000) });
            if (!response.ok) throw new Error("Cloudflare audit API failed with HTTP " + response.status);
            const payload = await response.json();
            if (payload.success !== true) throw new Error("Cloudflare audit API returned failure");
            return payload.result;
          }
          const deployments = await get("/deployments?per_page=1");
          const deployment = deployments?.deployments?.[0];
          const active = deployment?.versions?.filter(v => v.percentage > 0);
          if (active?.length !== 1 || active[0].percentage !== 100 || !active[0].version_id) throw new Error("Expected one active Worker version with 100% traffic");
          const version = await get("/versions/" + encodeURIComponent(active[0].version_id));
          const bindings = version?.resources?.bindings;
          if (!Array.isArray(bindings)) throw new Error("Cannot verify active Worker bindings");
          const named = name => bindings.filter(b => b.name === name);
          const flag = named("URL_READER_ENABLED");
          if (flag.length !== 1 || flag[0].type !== "plain_text" || flag[0].text !== "false") throw new Error("Active Worker URL Reader is not verifiably OFF");
          const limit = named("TAVILY_EXTRACT_DAILY_URL_LIMIT");
          if (limit.length && (limit.length !== 1 || limit[0].type !== "plain_text" || !/^(?:0+)$/.test(limit[0].text || ""))) throw new Error("Active Worker Tavily daily extraction quota is not verifiably zero");
          const releaseMessage = deployment?.annotations?.["workers/message"];
          const expected = "github-sha:" + process.env.EXPECTED_MAIN_SHA;
          if (releaseMessage !== expected) {
            console.log("::warning::Production release differs from audited main commit (or release annotation is missing). Deployment is a separate approval step.");
            console.log("Production release synchronization: PENDING");
          } else {
            console.log("Production release synchronization: MATCHED");
          }
          console.log("Active Worker URL Reader: OFF");
          console.log("Active Worker Tavily Extract daily quota: absent or zero");
          console.log("Binding names and secret values are not printed");
          NODE
