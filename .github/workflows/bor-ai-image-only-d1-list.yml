name: BOR AI image-only D1 migrations inventory (read-only)

# Dedicated to image schema review; never mutate production D1.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bor-ai-image-only-d1-list.yml'
      - 'scripts/prepare-image-only-migration-list.mjs'
      - 'tests/image-only-migration-list.test.js'

permissions:
  contents: read

jobs:
  inspect:
    name: List image-only D1 migrations without SQL changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verify isolated image schema and source-only safety
        run: node --test tests/image-only-migration-list.test.js
      - name: Create local image-only listing config (never deploy)
        run: node scripts/prepare-image-only-migration-list.mjs
      - name: List all pending migrations in production D1 (NO APPLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations list bor-ai-chat --remote --config wrangler.jsonc
      - name: List pending image-only migrations in production D1 (NO APPLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations list bor-ai-chat --remote --config wrangler.image-only-migrations.generated.jsonc
