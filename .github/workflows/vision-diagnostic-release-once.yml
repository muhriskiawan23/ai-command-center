name: BOR AI one-time vision diagnostics release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vision-diagnostic-release-once.yml

permissions:
  contents: read

concurrency:
  group: bor-ai-production-deploy
  cancel-in-progress: false

jobs:
  release:
    name: Validate, deploy, and test one diagnostic release
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GOOGLE_CLIENT_ID"
      - name: Run tests, checks, and preview
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run preview
      - name: Verify pinned production D1 database (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_ID="$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          const config=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));
          const database=config.d1_databases?.find(item=>item.binding==="DB");
          if(database?.database_name!=="bor-ai-chat" || !database.database_id) throw Error("Unexpected production database.");
          process.stdout.write(database.database_id);
          NODE
          )"
          RESPONSE="$(curl --silent --show-error --fail -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID")"
          printf '%s' "$RESPONSE" | DB_ID="$DB_ID" node --input-type=module -e '
            let s="";for await(const chunk of process.stdin)s+=chunk;
            const data=JSON.parse(s);
            if(data.success!==true || data.result?.uuid!==process.env.DB_ID || data.result?.name!=="bor-ai-chat") throw Error("Pinned production D1 mismatch");
          '
      - name: Deploy Worker and assets (no migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy -- --message "vision-diagnostic:github-sha:$GITHUB_SHA"
      - name: Verify production health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'https://ai-command-center.muhriskiawan23.workers.dev/api/health?deep=1' | node --input-type=module -e '
            let s="";for await(const chunk of process.stdin)s+=chunk;
            const d=JSON.parse(s);
            if(d.ok!==true || d.checks?.database!==true || d.checks?.aiBinding!==true) throw Error("Production health check failed");
          '
      - name: Diagnose one synthetic photo (no user data)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/diagnose-production-vision.mjs
