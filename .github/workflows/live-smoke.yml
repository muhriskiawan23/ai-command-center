name: Live Worker Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-smoke.yml"
  workflow_dispatch:
    inputs:
      run_chat:
        description: "Also send one low-cost POST /api/chat request to the live Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-worker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Verify live Worker endpoints
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check live health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 15 --output "$response_file" --write-out '%{http_code}' 'https://ai-command-center.muhriskiawan23.workers.dev/api/health')"
          cat "$response_file"
          test "$status" = "200"
          node --input-type=module - "$response_file" <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (data.ok !== true || !["BOR AI", "AI Command Center"].includes(data.service)) {
            throw new Error("Unexpected health response shape");
          }
          NODE
          rm -f "$response_file"

      - name: Check production CSP and top-level script SRI
        shell: bash
        run: |
          set -euo pipefail
          headers_file="$(mktemp)"
          html_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 15 --dump-header "$headers_file" --output "$html_file" --write-out '%{http_code}' 'https://ai-command-center.muhriskiawan23.workers.dev/')"
          test "$status" = "200"
          node --input-type=module - "$headers_file" "$html_file" <<'NODE'
          import fs from "node:fs";
          const headerBlocks = fs.readFileSync(process.argv[2], "utf8").trim().split(/\r?\n\r?\n/);
          const finalBlock = headerBlocks.filter((block) => /^HTTP\//i.test(block)).at(-1) || "";
          const headers = Object.fromEntries(finalBlock.split(/\r?\n/).slice(1).map((line) => {
            const index = line.indexOf(":");
            return index < 0 ? ["", ""] : [line.slice(0, index).trim().toLowerCase(), line.slice(index + 1).trim()];
          }));
          const csp = headers["content-security-policy"];
          console.log("Production response status:", finalBlock.split(/\\r?\\n/)[0] || "missing");
          console.log("Production Content-Type:", headers["content-type"] || "missing");
          console.log("Production CSP header present:", Boolean(csp));
          if (!csp) {
            console.log("Observed response header names:", Object.keys(headers).sort().join(", "));
            throw new Error("Production Content-Security-Policy header is missing.");
          }
          const directive = (name) => csp.split(";").map((part) => part.trim()).find((part) => part.startsWith(name + " ")) || "";
          const script = directive("script-src");
          const style = directive("style-src");
          const images = directive("img-src");
          if (!script || script.includes("'unsafe-inline'")) throw new Error("script-src is missing or permits unsafe inline scripts.");
          if (!style || style.includes("'unsafe-inline'")) throw new Error("style-src is missing or permits unsafe inline styles.");
          if (!images || images.split(/\s+/).includes("https:")) throw new Error("img-src is missing or allows unrestricted HTTPS images.");
          for (const required of ["object-src 'none'", "frame-ancestors 'none'", "style-src-attr 'unsafe-inline'"]) {
            if (!csp.includes(required)) throw new Error("Required CSP directive missing: " + required);
          }
          const html = fs.readFileSync(process.argv[3], "utf8");
          for (const [label, pattern] of [
            ["PDF.js", /<script\b[^>]*src=["'][^"']*pdfjs-dist[^"']*pdf\.min\.js["'][^>]*>/i],
            ["Tesseract.js", /<script\b[^>]*src=["'][^"']*tesseract\.js[^"']*tesseract\.min\.js["'][^>]*>/i]
          ]) {
            const match = html.match(pattern)?.[0];
            if (!match || !/integrity=["']sha384-[^"']+["']/i.test(match) || !/crossorigin=["']anonymous["']/i.test(match)) {
              throw new Error(label + " production script is missing SHA-384 SRI or anonymous CORS.");
            }
          }
          console.log("Production CSP directives and PDF.js/Tesseract SHA-384 SRI verified.");
          NODE
          rm -f "$headers_file" "$html_file"

      - name: Check live agents endpoint
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 15 --output "$response_file" --write-out '%{http_code}' 'https://ai-command-center.muhriskiawan23.workers.dev/api/agents')"
          cat "$response_file"
          test "$status" = "200"
          node --input-type=module - "$response_file" <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expected = ["coordinator","researcher","analyst","writer","fact_checker","strategist","coder","planner","critic","summarizer"];
          if (!Array.isArray(data.agents)) throw new Error("agents must be an array");
          const actual = data.agents.map(agent => agent.id);
          if (expected.some(id => !actual.includes(id))) {
            throw new Error("One or more expected agents are missing");
          }
          NODE
          rm -f "$response_file"

      - name: Check malformed JSON is rejected
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 15 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{invalid-json' \
            --output "$response_file" \
            --write-out '%{http_code}' \
            'https://ai-command-center.muhriskiawan23.workers.dev/api/chat')"
          test "$status" = "400"
          node --input-type=module - "$response_file" <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (data.error !== "Request JSON tidak valid.") {
            throw new Error("Unexpected malformed-JSON error response");
          }
          NODE
          rm -f "$response_file"

      - name: Check empty chat message is rejected
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 15 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"message":"   ","agent":"coordinator"}' \
            --output "$response_file" \
            --write-out '%{http_code}' \
            'https://ai-command-center.muhriskiawan23.workers.dev/api/chat')"
          test "$status" = "400"
          node --input-type=module - "$response_file" <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (data.error !== "Pesan tidak boleh kosong.") {
            throw new Error("Unexpected empty-message error response");
          }
          NODE
          rm -f "$response_file"

      - name: Check live chat endpoint (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_chat }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 60 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"message":"Jelaskan manajemen risiko dalam tepat 3 poin singkat.","agent":"coordinator"}' \
            --output "$response_file" \
            --write-out '%{http_code}' \
            'https://ai-command-center.muhriskiawan23.workers.dev/api/chat')"
          cat "$response_file"
          test "$status" = "200"
          node --input-type=module - "$response_file" <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (typeof data.response !== "string" || data.response.trim().length < 20) {
            throw new Error("Chat response is missing or too short");
          }
          if (data.workflow !== "multi-agent") {
            throw new Error("Expected coordinator to use the multi-agent workflow");
          }
          const requiredAgents = ["Researcher", "Analyst", "Fact Checker", "Writer"];
          if (!Array.isArray(data.agentsUsed) || requiredAgents.some(name => !data.agentsUsed.includes(name))) {
            throw new Error("One or more required multi-agent steps are missing");
          }
          const numberedItems = [...data.response.matchAll(/^\s*(\d+)\.\s+\S/gm)]
            .map(match => Number(match[1]));
          if (numberedItems.length !== 3 || numberedItems.some((number, index) => number !== index + 1)) {
            throw new Error("Chat response must contain exactly three sequential numbered points");
          }
          NODE
          rm -f "$response_file"
