name: BOR AI preview build

on:
  push:
    branches:
      - bor-ai/stage-02-quality-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bor-ai-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Validate Cloudflare Worker preview build
        run: npm run preview
