name: BOR AI preview build

on:
  push:
    branches:
      - bor-ai/stage-02-quality-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bor-ai-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Validate Cloudflare Worker preview build
        run: npm run preview
      - name: Validate isolated SQLite journal staging Worker build (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-chat-journal-staging.mjs
          npx --yes wrangler@4 deploy --dry-run \
            --config wrangler.chat-journal-staging.generated.jsonc \
            --outdir .wrangler/chat-journal-stage-preview

      - name: Validate isolated private D1-to-R2 backup Workflow (dry-run only, no data access)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-chat-private-backup-staging.mjs
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.chat-private-backup.generated.jsonc','utf8'));
          if(c.vars.BOR_BACKUP_ENABLED!=='false'||c.vars.BOR_BACKUP_OWNER_APPROVED!=='false'||
             c.name==='ai-command-center'||c.d1_databases||c.routes||c.triggers||c.assets||
             c.workflows?.length!==1||c.workflows[0].schedules)
            throw Error('Isolated D1 backup staging must be inactive, manual and non-deployable as primary Worker');
          console.log('Private D1-to-R2 backup Workflow config audited: safe OFF.');
          NODE
          npx --yes wrangler@4 deploy --dry-run \
            --config wrangler.chat-private-backup.generated.jsonc \
            --outdir .wrangler/chat-private-backup-stage-preview
