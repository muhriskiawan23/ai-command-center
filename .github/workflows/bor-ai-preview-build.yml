name: BOR AI preview build

on:
  push:
    branches:
      - bor-ai/stage-02-quality-hardening
  pull_request:
    branches:
      - main

jobs:
  preview-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Cloudflare Worker preview build
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler/deploy --config wrangler.jsonc
