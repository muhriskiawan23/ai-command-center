name: BOR AI preview build

on:
  push:
    branches:
      - bor-ai/stage-02-quality-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bor-ai-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate Cloudflare Worker preview build
        run: npm run preview
