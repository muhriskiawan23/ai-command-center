name: BOR AI Stage 3 remote D1 journal proof (MANUAL SANDBOX ONLY)

# Prepared manual dispatcher. NO push/PR/schedule triggers and NO production deploy.
# Requires a NEW empty D1 DB and explicit owner review/approval before any run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bor-ai-stage3-remote-d1-sandbox
  cancel-in-progress: false

jobs:
  stage3-remote-d1:
    name: Verify three SQL migrations on NEW disposable remote D1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: billing-sandbox
    env:
      CI: 'true'
      CLOUDFLARE_SEND_METRICS: 'false'
      PINNED_TEST_SHA: '79d790364d45ad93b1f9128f15b8aae258b58ae9'
    steps:
      - name: Refuse manual dispatch from any branch other than main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo '::error::Stage 3 sandbox dispatcher must run from main only'
            exit 1
          }
      - name: Checkout pinned reviewed unmerged test SHA, NOT production main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79d790364d45ad93b1f9128f15b8aae258b58ae9
          persist-credentials: false
      - name: Refuse unreviewed or changed test commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$PINNED_TEST_SHA" || {
            echo '::error::Sandbox test commit does not match reviewed pin'
            exit 1
          }
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      # Only the separately locked Wrangler dependency graph is required.
      # The proof uses built-in node: modules and repository-local source.
      - name: Install audited integrity-locked Wrangler CLI BEFORE sandbox credentials are available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage3-wrangler"
          cp tests/billing/stage3-wrangler-lock/package.json tests/billing/stage3-wrangler-lock/package-lock.json "$RUNNER_TEMP/stage3-wrangler/"
          npm ci --prefix "$RUNNER_TEMP/stage3-wrangler" --ignore-scripts --no-audit --no-fund
          npm audit --prefix "$RUNNER_TEMP/stage3-wrangler" --audit-level=high --no-fund
          "$RUNNER_TEMP/stage3-wrangler/node_modules/.bin/wrangler" --version
      - name: Verify exact NEW remote Stage 3 database and synthetic financial invariants
        # Secrets exist ONLY during this audited test step. In particular,
        # actions/checkout, setup-node and the locked Wrangler npm ci never receive D1 credentials.
        env:
          BOR_AI_STAGE3_WRANGLER_BIN: ${{ runner.temp }}/stage3-wrangler/node_modules/.bin/wrangler
          BOR_AI_D1_SANDBOX_TOKEN: ${{ secrets.BOR_AI_D1_SANDBOX_TOKEN }}
          BOR_AI_D1_SANDBOX_ACCOUNT_ID: ${{ vars.BOR_AI_D1_SANDBOX_ACCOUNT_ID }}
          BOR_AI_D1_STAGE3_DB_NAME: ${{ vars.BOR_AI_D1_STAGE3_DB_NAME }}
          BOR_AI_D1_STAGE3_DB_ID: ${{ vars.BOR_AI_D1_STAGE3_DB_ID }}
          BOR_AI_D1_SANDBOX_DB_NAME: ${{ vars.BOR_AI_D1_SANDBOX_DB_NAME }}
          BOR_AI_D1_SANDBOX_DB_ID: ${{ vars.BOR_AI_D1_SANDBOX_DB_ID }}
        run: node tests/billing/stage3-d1-proof.mjs --remote
      - name: Classify evidence accurately
        run: |
          echo 'Stage 3 SQL-only D1 proof passed using an isolated disposable remote database.'
          echo 'No paid model provider usage, invoices, live payments, production migration or Worker deployment verified.'