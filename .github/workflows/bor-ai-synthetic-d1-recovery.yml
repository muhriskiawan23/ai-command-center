name: BOR AI synthetic D1 export and restore drill (manual isolated)

# Strictly synthetic 2-DB drill. NEVER touch the pinned production bor-ai-chat D1.
# No workflow_run, push or schedule trigger, and no image/paid-provider calls.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "plan=unit tests only; drill=create two RUN-ID-scoped synthetic D1s, export, restore, verify, delete"
        type: choice
        options: [plan, drill]
        required: true
        default: plan
      reviewed_main_sha:
        description: "DRILL: exact 40-character main SHA reviewed after green CI"
        type: string
        required: false
        default: ""
      owner_confirmation:
        description: "DRILL: I_APPROVE_SYNTHETIC_D1_CREATE_EXPORT_RESTORE_CLEANUP"
        type: string
        required: false
        default: ""
      storage_cost_approval:
        description: "DRILL: I_APPROVE_TEMP_SYNTHETIC_D1_CLOUDFLARE_USAGE"
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: bor-ai-production-deploy
  cancel-in-progress: false

jobs:
  synthetic_d1:
    name: Temporary D1 source -> export -> temporary D1 restore -> cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    steps:
      - name: Fail closed on ref, SHA, approvals and scope before any D1 operations
        shell: bash
        env:
          PHASE: ${{ inputs.phase }}
          REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
          OWNER: ${{ inputs.owner_confirmation }}
          STORAGE: ${{ inputs.storage_cost_approval }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Main only"; exit 1; }
          if [[ "$PHASE" == "plan" ]]; then
            [[ -z "$REVIEWED_SHA" && -z "$OWNER" && -z "$STORAGE" ]] || {
              echo "::error::PLAN must not receive mutation approvals"; exit 1;
            }
          elif [[ "$PHASE" == "drill" ]]; then
            [[ "$REVIEWED_SHA" == "$GITHUB_SHA" && "$OWNER" == "I_APPROVE_SYNTHETIC_D1_CREATE_EXPORT_RESTORE_CLEANUP" &&
               "$STORAGE" == "I_APPROVE_TEMP_SYNTHETIC_D1_CLOUDFLARE_USAGE" ]] || {
              echo "::error::Synthetic DRILL requires exact reviewed main SHA and owner/cost approvals"; exit 1;
            }
          else
            echo "::error::Unrecognized phase"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Verify synthetic identity, URL, cleanup and production-denial tests
        run: |
          node --check scripts/synthetic-d1-export-recovery-drill.mjs
          node --test tests/synthetic-d1-export-recovery.test.js

      - name: Ensure reviewed main has not moved before any real Cloudflare calls
        if: ${{ inputs.phase == 'drill' }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$sha" == "$GITHUB_SHA" ]] || {
            echo "::error::main moved; a new reviewed PLAN is needed"; exit 1;
          }

      - name: Execute synthetic D1 source/export/restore/cleanup only
        if: ${{ inputs.phase == 'drill' }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOR_PRIVATE_D1_EXPORT_TOKEN: ${{ secrets.BOR_PRIVATE_D1_EXPORT_TOKEN }}
          BOR_SYNTHETIC_OWNER_APPROVAL: ${{ inputs.owner_confirmation }}
          BOR_SYNTHETIC_COST_APPROVED: "true"
        run: |
          set -euo pipefail
          # Script independently pins account, production D1 denylist, run-scoped
          # source + recovery target, 1MiB synthetic export, cleanup and consent.
          # This is NOT a production D1 export or a chat disaster-recovery test.
          node scripts/synthetic-d1-export-recovery-drill.mjs

      - name: PLAN complete, no Cloudflare operations
        if: ${{ inputs.phase == 'plan' }}
        run: echo "Synthetic D1 PLAN passed. No Cloudflare resources created, queries, exports, imports or deletes."
